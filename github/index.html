<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Study site for Cambridge IGCSE Hindi as a Second Language 0549 (2027-2029): reading practice, A* writing samples, vocabulary and past papers.">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Zyvar Hindi 0549</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: "Neel aur Genda" (indigo and marigold). A deep indigo band carries the header and the home hero,
   with a faint jaali lattice. Every page title is a Hindi word whose shirorekha (headline bar) runs on
   as a marigold rule. Content sits on quiet white cards; underline tabs instead of stacked headings. */
:root{
  --bg:#F5F5F1; --surface:#FFFFFF; --sunk:#EFEFE9; --ink:#14183A; --muted:#5B6078; --line:#E3E2DA;
  --accent:#283593; --accent-ink:#FFFFFF; --accent-soft:#E8EAF6;
  --saffron:#E9A100; --saffron-ink:#241900; --saffron-soft:#FFF2CC;
  --band:#151B4A; --band-2:#1D2563; --band-ink:#F5F3FF; --band-muted:#B8BDE6;
  --hl:#FFE08A; --hl-ink:#3D2C00; --cx:#00796B; --cx-bg:#D9F1EE;
  --ok:#1B7447; --ok-bg:#E2F3EA; --bad:#B0342C; --bad-bg:#FBE6E3; --warn:#8A5A00; --warn-bg:#FFF1D2;
  --shadow:0 1px 2px rgba(20,24,58,.05),0 10px 30px rgba(20,24,58,.07);
  --ui:"Mukta","Noto Sans Devanagari","Nirmala UI","Segoe UI",system-ui,sans-serif;
  --read:"Tiro Devanagari Hindi","Noto Serif Devanagari","Nirmala UI","Mangal",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0F26; --surface:#141A3A; --sunk:#0F1430; --ink:#ECEDF7; --muted:#A3A8C8; --line:#262D57;
  --accent:#A8B4FF; --accent-ink:#0B0F26; --accent-soft:#1E2656;
  --saffron:#F5B92E; --saffron-ink:#1A1200; --saffron-soft:#3A2E0E;
  --band:#080B1E; --band-2:#10163A; --band-ink:#ECEDF7; --band-muted:#9EA4CF;
  --hl:#6A5110; --hl-ink:#FFE7A3; --cx:#5FD3BF; --cx-bg:#123B36;
  --ok:#62CF98; --ok-bg:#123324; --bad:#F2928A; --bad-bg:#3A1A18; --warn:#F3C46B; --warn-bg:#3A2C10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B0F26; --surface:#141A3A; --sunk:#0F1430; --ink:#ECEDF7; --muted:#A3A8C8; --line:#262D57;
  --accent:#A8B4FF; --accent-ink:#0B0F26; --accent-soft:#1E2656;
  --saffron:#F5B92E; --saffron-ink:#1A1200; --saffron-soft:#3A2E0E;
  --band:#080B1E; --band-2:#10163A; --band-ink:#ECEDF7; --band-muted:#9EA4CF;
  --hl:#6A5110; --hl-ink:#FFE7A3; --cx:#5FD3BF; --cx-bg:#123B36;
  --ok:#62CF98; --ok-bg:#123324; --bad:#F2928A; --bad-bg:#3A1A18; --warn:#F3C46B; --warn-bg:#3A2C10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.2}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hi{font-family:var(--read)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.grid2>*,.grid3>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.list{padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.note{background:var(--sunk);border-radius:10px;padding:12px 16px;color:var(--muted);font-size:.94rem}
.note strong{color:var(--ink)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.lab{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:1.08rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand .hi{font-weight:400;color:var(--accent)}
.nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 300px;scrollbar-width:none}
.nav a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{padding-block:28px 110px}
.view{display:flex;flex-direction:column;gap:24px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .2s ease-out}@keyframes in{from{transform:translateY(5px)}to{transform:none}}}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead h1{font-size:clamp(1.6rem,4vw,2.2rem)}
.pagehead p{color:var(--muted);max-width:64ch}

/* controls */
.seg{display:inline-flex;gap:3px;background:var(--sunk);padding:4px;border-radius:12px;flex-wrap:wrap;max-width:100%}
.seg button{font:inherit;font-weight:600;font-size:.95rem;border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.ai{border-style:dashed;color:var(--accent)}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:8px}
.btn.sm{font-size:.9rem;padding:5px 12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.gold{background:var(--hl);color:var(--hl-ink)}
.pill.teal{background:var(--cx-bg);color:var(--cx)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.fold>summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:1.3rem;color:var(--muted);line-height:1}
details.fold[open]>summary::after{content:"\2212"}
details.fold>summary small{font-weight:400;color:var(--muted);margin-left:auto;text-align:right}
@media (max-width:600px){details.fold>summary small{display:none}}
details.fold>.inner{padding:0 18px 18px;display:flex;flex-direction:column;gap:16px}
select,input[type=text],input[type=search],textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{font-family:var(--read);font-size:1.08rem;line-height:1.9;min-height:240px;resize:vertical}
textarea.plain{font-family:var(--ui);font-size:1rem;line-height:1.6;min-height:90px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.96rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.hero h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:700;letter-spacing:-.01em}
.hero h1 .hi{color:var(--accent);font-weight:400}
.hero p{color:var(--muted);max-width:60ch;font-size:1.06rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:150px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.tile:hover{transform:translateY(-2px)}}
.tile .big{font-family:var(--read);font-size:1.7rem;color:var(--accent);line-height:1.2}
.tile b{font-size:1.06rem}
.tile span{color:var(--muted);font-size:.93rem}
.tile .meta{margin-top:auto;font-size:.82rem;font-weight:600;color:var(--muted)}
.wod{display:flex;flex-direction:column;gap:6px}
.wod .w{font-family:var(--read);font-size:2.2rem;line-height:1.3}
.prog{display:flex;flex-direction:column;gap:12px}
.prog .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.93rem}
.bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tnum{font-variant-numeric:tabular-nums;color:var(--muted)}
.markbar{display:flex;gap:3px;height:52px}
.markbar button{flex-basis:0;min-width:0;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.markbar button small{font-weight:500;font-size:.72rem;opacity:.85}
.markbar .rd{background:var(--accent);color:var(--accent-ink)}
.markbar .wr{background:var(--hl);color:var(--hl-ink)}

/* reading */
.toolbar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.desk{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.desk{grid-template-columns:minmax(0,1fr)}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
@media (min-width:881px){.paper.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 96px);overflow-y:auto}}
.paper .ttl{font-family:var(--read);font-size:1.5rem;line-height:1.4}
.passage{font-family:var(--read);font-size:1.2rem;line-height:2.05;display:flex;flex-direction:column;gap:14px}
.passage .who{font-family:var(--ui);font-weight:700;font-size:.98rem;color:var(--accent)}
.instr{font-family:var(--read);font-size:1.06rem;line-height:1.8}
button.w,button.cx{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:help;border-radius:0;text-align:inherit}
button.w{border-bottom:2px dotted var(--accent)}
button.cx{border-bottom:2px solid var(--cx)}
button.w:hover,button.w.on{background:var(--hl);color:var(--hl-ink)}
button.cx:hover,button.cx.on{background:var(--cx-bg)}
mark.lk{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px}
#tip{position:absolute;z-index:30;max-width:300px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:.92rem;line-height:1.4;box-shadow:var(--shadow)}
#tip b{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.key{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.key b.d{border-bottom:2px dotted var(--accent);font-weight:500;color:var(--ink)}
.key b.u{border-bottom:2px solid var(--cx);font-weight:500;color:var(--ink)}
.qlist{display:flex;flex-direction:column;gap:18px;list-style:none;padding:0}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.qtop{display:flex;gap:10px;align-items:baseline}
.qn{font-weight:700;font-variant-numeric:tabular-nums;min-width:1.6em;color:var(--accent)}
.qt{flex:1;min-width:0;font-family:var(--read);font-size:1.1rem;line-height:1.75}
.qm{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.9rem}
.qen{color:var(--muted);font-size:.9rem;padding-left:calc(1.6em + 10px)}
.qbody{padding-left:calc(1.6em + 10px);display:flex;flex-direction:column;gap:8px}
@media (max-width:480px){.qen,.qbody{padding-left:0}}
.qbody input[type=text]{font-family:var(--read);font-size:1.06rem}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{position:relative;display:flex}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{flex:1;display:block;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--bg);font-family:var(--read);font-size:1.05rem;line-height:1.6}
.opts.row .opt span{font-family:var(--ui);font-weight:700;min-width:46px;text-align:center}
.opt input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.fb{font-size:.93rem;border-radius:10px;padding:8px 12px}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .why{color:var(--ink);display:block;margin-top:2px}
.ans{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ans label{display:flex;gap:8px;align-items:baseline;font-family:var(--read);font-size:1.05rem;line-height:1.6}
.ans input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.score{font-weight:700;font-variant-numeric:tabular-nums}

/* samples */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;position:relative}
.scard:hover{border-color:var(--accent)}
.scard b{font-size:1rem;line-height:1.35}
.scard .hi{color:var(--muted);font-size:.95rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .row{gap:6px}
.scard .seen{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.task{border:1px dashed var(--muted);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.task .hi{font-size:1.1rem;line-height:1.8}
.task ul{padding-left:1.2em}
.task li small{display:block;color:var(--muted);font-family:var(--ui);font-size:.86rem;line-height:1.4}
.model{display:flex;flex-direction:column}
.mp{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.mp:last-child{border-bottom:0}
@media (max-width:640px){.mp{grid-template-columns:minmax(0,1fr)}}
.mp .tag{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:.55em}
.mp .hi{font-size:1.18rem;line-height:2;white-space:pre-line}
.mp .en{color:var(--muted);font-size:.93rem;margin-top:4px;white-space:pre-line}
.band{display:grid;grid-template-columns:58px 1fr;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.band:last-child{border-bottom:0}
.band .mk{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.band p{color:var(--muted);font-size:.94rem}
.band p strong{color:var(--ink)}
.steps{display:flex;flex-direction:column;list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.steps .hi{font-size:1.06rem;display:block}
.steps small{color:var(--muted);font-size:.9rem}

/* marking */
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:92px;height:116px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:4px;top:4px;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:700;border-radius:4px;padding:0 6px}
.thumb button{position:absolute;right:4px;top:4px;border:0;border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;font-size:.72rem;font-weight:700;padding:1px 6px;cursor:pointer}
.meter{position:relative;height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:60%;width:20%;background:var(--ok-bg);border-inline:2px solid var(--ok)}
.meter .fill{position:absolute;top:3px;bottom:3px;left:0;background:var(--accent);border-radius:99px;max-width:100%}
.checks{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;font-size:.95rem}
.checks label{display:flex;gap:10px;align-items:baseline}
.checks input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.2rem}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.scores{grid-template-columns:minmax(0,1fr)}}
.sbox{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sbox .big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sbox .big small{font-size:1rem;color:var(--muted);font-weight:600}
.sbox.total{background:var(--accent);color:var(--accent-ink)}
.sbox.total .big small,.sbox.total .lab{color:var(--accent-ink);opacity:.85}
.sbox .bar{background:var(--line)}
.sbox.total .bar{background:rgba(255,255,255,.3)} .sbox.total .bar i{background:var(--accent-ink)}
.cov{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0}
.cov li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}

{label:"Set B",title:"मुंबई के डिब्बेवाले",
 instr:"‘मुंबई के डिब्बेवाले’ आलेख को पढ़िए और नीचे दिए गए प्रश्नों के उत्तर दीजिए।",
 instrEn:"Read the article 'The Dabbawalas of Mumbai' and answer the questions below.",
 paras:[
 "मुंबई में हर सुबह लाखों लोग काम पर जाने के लिए जल्दी घर से निकलते हैं। इतनी जल्दी में घर का बना खाना साथ ले जाना आसान नहीं होता। इस [[समस्या|problem]] का [[समाधान|solution]] मुंबई के [[डिब्बेवालों|lunchbox carriers]] ने सन 1890 में, यानी सवा सौ साल से भी पहले, ढूँढ लिया था।",
 "आज लगभग पाँच हज़ार डिब्बेवाले हर दिन लगभग दो लाख खाने के डिब्बे घरों से दफ़्तरों तक पहुँचाते हैं। वे सुबह घर-घर जाकर डिब्बे [[इकट्ठा|collect]] करते हैं, फिर उन्हें लोकल ट्रेन, साइकिल और [[हाथगाड़ी|handcart]] से ले जाते हैं। दोपहर के खाने के बाद वही डिब्बे ख़ाली होकर उसी घर में वापस पहुँच जाते हैं।",
 "सबसे [[आश्चर्य|surprise]] की बात यह है कि अधिकतर डिब्बेवाले बहुत कम पढ़े-लिखे हैं। वे कंप्यूटर या मोबाइल ऐप का प्रयोग नहीं करते। हर डिब्बे पर रंगों, अक्षरों और [[अंकों|numbers]] का एक सरल [[संकेत|code, sign]] लिखा होता है, जिससे पता चलता है कि डिब्बा किस स्टेशन से आया है और किस इमारत में जाना है। कहा जाता है कि उनसे ग़लती लगभग कभी नहीं होती।",
 "डिब्बेवालों की [[सफलता|success]] का [[रहस्य|secret]] उनका [[अनुशासन|discipline]] और [[ईमानदारी|honesty]] है। बारिश हो या धूप, वे हर दिन [[समय पर|on time]] पहुँचते हैं। काम के समय वे सफ़ेद कपड़े और गांधी टोपी पहनते हैं। उनकी इस [[व्यवस्था|system]] को समझने के लिए दुनिया भर से [[प्रबंधन|management]] के विद्यार्थी और विशेषज्ञ मुंबई आते हैं।"],
 qs:[
 {q:"डिब्बेवालों ने किस समस्या का समाधान ढूँढा?",en:"What problem did the dabbawalas solve?",marks:1,ans:["लोगों तक घर का बना खाना (दफ़्तर में) पहुँचाना"]},
 {q:"डिब्बेवालों ने यह काम कब शुरू किया?",en:"When did the dabbawalas begin this work?",marks:1,ans:["सन 1890 में"]},
 {q:"डिब्बे ले जाने के लिए वे किस साधन का प्रयोग करते हैं? कोई एक लिखिए।",en:"What means of transport do they use? Write one.",marks:1,ans:["लोकल ट्रेन / साइकिल / हाथगाड़ी (any one)"]},
 {q:"डिब्बे पर लिखे संकेत से क्या पता चलता है?",en:"What does the code written on the box show?",marks:1,ans:["डिब्बा किस स्टेशन से आया है और किस इमारत में जाना है"]},
 {q:"दुनिया भर से लोग मुंबई क्यों आते हैं?",en:"Why do people come to Mumbai from all over the world?",marks:1,ans:["डिब्बेवालों की व्यवस्था समझने के लिए"]},
 {q:"डिब्बेवालों की सफलता के पीछे कौन सी बातें हैं? कोई तीन लिखिए।",en:"What lies behind the dabbawalas' success? Write any three.",marks:3,ans:["अनुशासन","ईमानदारी","हर दिन समय पर पहुँचना (बारिश हो या धूप)","सरल संकेत / ग़लती लगभग कभी नहीं होती"]}
 ]}
],
2:[
{label:"Set A",title:"मेरा पसंदीदा शौक़",
 instr:"चार विद्यार्थियों (A–D) के शौक़ के बारे में पढ़िए और नीचे दिए गए वक्तव्यों के लिए सही अक्षर चुनिए। कौन सा व्यक्ति यह बात कहता है?",
 instrEn:"Read about the hobbies of four students (A to D) and choose the correct letter for each statement. Which person says this?",
 texts:[
 {l:"A",n:"रिया",t:"मुझे किताबें पढ़ना बहुत पसंद है। हर शनिवार मैं अपने [[मोहल्ले|neighbourhood]] के [[पुस्तकालय|library]] जाती हूँ और दो-तीन किताबें घर ले आती हूँ। मुझे [[जासूसी|detective]] कहानियाँ सबसे अच्छी लगती हैं। मेरे दोस्त कहते हैं कि पढ़ना [[उबाऊ|boring]] है, पर मुझे लगता है कि किताबों से मेरी भाषा बेहतर हुई है। इस [[शौक़|hobby]] में पैसे भी [[ख़र्च|spent]] नहीं होते।"},
 {l:"B",n:"कबीर",t:"मैं रोज़ शाम को अपने दोस्तों के साथ पार्क में क्रिकेट खेलता हूँ। पिछले साल मुझे स्कूल की टीम में [[चुना|selected]] गया, इसलिए अब मैं सुबह जल्दी उठकर [[अभ्यास|practice]] भी करता हूँ। खेल ने मुझे सिखाया है कि हारने के बाद भी [[हिम्मत|courage]] नहीं छोड़नी चाहिए। बस एक समस्या है: [[परीक्षा|exam]] के दिनों में पढ़ाई और खेल दोनों के लिए समय निकालना मुश्किल हो जाता है।"},
 {l:"C",n:"मीरा",t:"खाना बनाना मेरा शौक़ है। यह मैंने अपनी दादी से सीखा, जो हर रविवार मुझे कोई नया [[व्यंजन|dish]] सिखाती हैं। पहले मैं सिर्फ़ चाय बना पाती थी, लेकिन अब पूरे परिवार के लिए खाना बना लेती हूँ। जब सब लोग मेरे खाने की [[तारीफ़|praise]] करते हैं तो मुझे बहुत ख़ुशी होती है। बड़ी होकर मैं अपना रेस्तराँ खोलना चाहती हूँ।"},
 {l:"D",n:"अर्जुन",t:"मुझे [[पक्षियों|birds]] की [[तस्वीरें|pictures, photos]] खींचने का शौक़ है। मेरे चाचा ने मेरे जन्मदिन पर मुझे एक पुराना कैमरा दिया था, तभी से यह शुरू हुआ। अच्छी तस्वीर के लिए कभी-कभी घंटों [[चुपचाप|silently]] बैठना पड़ता है, इसलिए इस शौक़ ने मुझे [[धैर्य|patience]] सिखाया है। पिछले महीने मेरी एक तस्वीर [[स्थानीय|local]] अख़बार में छपी थी।"}],
 qs:[
 {q:"इस व्यक्ति ने अपना शौक़ परिवार के एक बुज़ुर्ग से सीखा।",en:"This person learned the hobby from an elder in the family.",a:"C",why:"Meera learned cooking from her grandmother (दादी)."},
 {q:"इस व्यक्ति के शौक़ पर कोई ख़र्च नहीं होता।",en:"This person's hobby costs nothing.",a:"A",why:"Riya says no money is spent on her hobby."},
 {q:"इस व्यक्ति को अपने शौक़ के लिए देर तक इंतज़ार करना पड़ता है।",en:"This person has to wait a long time for the hobby.",a:"D",why:"Arjun sometimes sits silently for hours to get a good photo."},
 {q:"इस व्यक्ति के लिए कभी-कभी पढ़ाई और शौक़ दोनों को समय देना कठिन होता है।",en:"This person sometimes finds it hard to give time to both study and the hobby.",a:"B",why:"Kabir struggles to find time for both during exams."},
 {q:"इस व्यक्ति के दोस्तों को उसका शौक़ मज़ेदार नहीं लगता।",en:"This person's friends do not find the hobby fun.",a:"A",why:"Riya's friends say reading is boring (उबाऊ)."},
 {q:"इस व्यक्ति का काम लोगों के सामने छप चुका है।",en:"This person's work has been published.",a:"D",why:"Arjun's photo was printed in the local newspaper."},
 {q:"यह व्यक्ति अपने शौक़ को आगे चलकर अपना काम बनाना चाहता है।",en:"This person wants to turn the hobby into a career.",a:"C",why:"Meera wants to open her own restaurant."},
 {q:"इस व्यक्ति का शौक़ एक उपहार से शुरू हुआ।",en:"This person's hobby began with a gift.",a:"D",why:"Arjun's uncle gave him a camera on his birthday."},
 {q:"इस व्यक्ति ने अपने शौक़ से सीखा कि हार के बाद भी कोशिश करते रहना चाहिए।",en:"This person learned from the hobby to keep trying even after losing.",a:"B",why:"Kabir says sport taught him not to lose courage after a defeat."}
 ]},
{label:"Set B",title:"छुट्टियों के शिविर",
 instr:"छुट्टियों में अलग-अलग शिविरों में गए चार विद्यार्थियों (A–D) के अनुभव पढ़िए और नीचे दिए गए वक्तव्यों के लिए सही अक्षर चुनिए। कौन सा व्यक्ति यह बात कहता है?",
 instrEn:"Read the experiences of four students (A to D) who went to different holiday camps, and choose the correct letter for each statement. Which person says this?",
 texts:[
 {l:"A",n:"तन्वी",t:"इस रोबोटिक्स [[शिविर|camp]] में हमने दस दिन में अपना छोटा रोबोट बनाया। शुरू में मुझे लगा कि यह मेरे लिए बहुत कठिन होगा, क्योंकि मुझे गणित से डर लगता है। लेकिन हमारे [[प्रशिक्षक|trainer]] हर बात को इतने [[धैर्य|patience]] से समझाते थे कि डर कब ख़त्म हुआ, पता ही नहीं चला। एक कमी यह थी कि शिविर की [[शुल्क|fee]] बहुत ज़्यादा थी; मेरे कई दोस्त चाहकर भी नहीं आ सके।"},
 {l:"B",n:"विवेक",t:"मनाली के पास हुए इस [[पर्वतारोहण|mountaineering]] शिविर में हम रोज़ सुबह छह बजे उठकर पहाड़ों पर [[चढ़ाई|climbing]] करते थे। रात को हम [[तंबुओं|tents]] में सोते थे और मोबाइल फ़ोन पहले दिन ही जमा करवा दिए गए थे। पहले दो दिन यह नियम मुझे बिल्कुल अच्छा नहीं लगा, पर बाद में मैंने अपने [[साथियों|companions]] से ख़ूब बातें कीं और कुछ पक्के दोस्त भी बनाए। अगले साल मैं अपने छोटे भाई को भी साथ ले जाऊँगा।"},
 {l:"C",n:"साहिल",t:"यह चित्रकला शिविर मेरे घर के पास ही था, इसलिए मैं रोज़ साइकिल से जाता था। हमें पानी के रंगों से चित्र बनाना सिखाया गया। शिविर के अंत में हुई [[प्रदर्शनी|exhibition]] में मेरे बनाए एक चित्र को पहला [[पुरस्कार|prize]] मिला। सच कहूँ तो कुछ कक्षाएँ थोड़ी लंबी और उबाऊ थीं, क्योंकि एक ही चीज़ बार-बार करनी पड़ती थी।"},
 {l:"D",n:"आयशा",t:"मुझे पानी से बहुत डर लगता था, इसलिए मम्मी ने मेरा नाम [[तैराकी|swimming]] शिविर में लिखवाया। पहले हफ़्ते मैं केवल किनारे पर बैठी रहती थी। हमारी प्रशिक्षिका ने कभी [[ज़बरदस्ती|force]] नहीं की; उन्होंने मुझे अपनी गति से सीखने दिया। आज मैं बिना किसी डर के पूरा [[तरणताल|swimming pool]] पार कर लेती हूँ। यह शिविर [[मुफ़्त|free of charge]] था, क्योंकि [[नगर निगम|city council]] इसे चलाता है।"}],
 qs:[
 {q:"इस व्यक्ति को शिविर का एक नियम शुरू में पसंद नहीं आया।",en:"At first this person did not like one of the camp's rules.",a:"B",why:"Vivek disliked handing in phones for the first two days."},
 {q:"इस शिविर में भाग लेने के लिए पैसे नहीं देने पड़े।",en:"No money had to be paid to join this camp.",a:"D",why:"Ayesha's camp was free because the city council runs it."},
 {q:"इस व्यक्ति के काम को सम्मान मिला।",en:"This person's work was honoured.",a:"C",why:"Sahil's painting won first prize at the exhibition."},
 {q:"इस व्यक्ति ने परिवार के किसी सदस्य के कहने पर शिविर में भाग लिया।",en:"This person joined the camp because a family member arranged it.",a:"D",why:"Ayesha's mother enrolled her."},
 {q:"इस व्यक्ति के अनुसार शिविर हर किसी की पहुँच में नहीं था।",en:"According to this person, the camp was not within everyone's reach.",a:"A",why:"Tanvi says the fee was too high and friends could not come."},
 {q:"इस व्यक्ति ने शिविर में नए रिश्ते बनाए।",en:"This person made new relationships at the camp.",a:"B",why:"Vivek made some close friends."},
 {q:"इस व्यक्ति के अनुसार शिविर में कभी-कभी दोहराव था।",en:"According to this person, there was sometimes repetition in the camp.",a:"C",why:"Sahil says the same thing had to be done again and again."},
 {q:"इस व्यक्ति का पढ़ाई के एक विषय से डर कम हुआ।",en:"This person became less afraid of a school subject.",a:"A",why:"Tanvi was afraid of maths. Ayesha's fear was of water, not a subject."},
 {q:"यह व्यक्ति किसी और को भी अगली बार शिविर में ले जाना चाहता है।",en:"This person wants to take someone else to the camp next time.",a:"B",why:"Vivek will take his younger brother next year."}
 ]}
],
3:[
{label:"Set A",title:"प्लास्टिक से छुटकारा",
 instr:"‘प्लास्टिक से छुटकारा’ आलेख को पढ़िए। कल्पना कीजिए कि आप अपनी कक्षा में इस विषय पर बोलने वाले हैं। प्रत्येक शीर्षक के अंतर्गत संक्षिप्त नोट बनाइए।",
 instrEn:"Read the article 'Getting Rid of Plastic'. Imagine you are going to give a talk on it to your class. Make brief notes under each heading.",
 paras:[
 "आजकल हम हर जगह प्लास्टिक देखते हैं: दुकानों की [[थैलियों|bags]] में, पानी की बोतलों में और खाने के डिब्बों में। प्लास्टिक सस्ता और हल्का होता है, इसलिए लोग इसे बहुत पसंद करते हैं। लेकिन यह हमारे [[पर्यावरण|environment]] के लिए एक बड़ी [[समस्या|problem]] बन गया है।",
 "सबसे बड़ी [[परेशानी|trouble]] यह है कि प्लास्टिक [[सैकड़ों|hundreds of]] वर्षों तक [[नष्ट|destroyed]] नहीं होता। सड़कों पर फेंकी गई थैलियाँ [[नालियों|drains]] को बंद कर देती हैं, जिससे बरसात में सड़कों पर पानी भर जाता है। कई बार गायें और दूसरे जानवर इन थैलियों को खा लेते हैं और बीमार पड़ जाते हैं। [[इसके अलावा|besides this]], नदियों और समुद्र में पहुँचा प्लास्टिक मछलियों की जान ले लेता है।",

{label:"Set B",title:"अच्छी नींद क्यों ज़रूरी है",

 "डॉक्टरों के अनुसार किशोरों को हर रात आठ से दस घंटे की नींद चाहिए। लेकिन [[सर्वेक्षणों|surveys]] से पता चलता है कि अधिकतर किशोर सात घंटे से भी कम सोते हैं। नींद पूरी न होने पर ध्यान कम लगता है, [[चिड़चिड़ापन|irritability]] बढ़ता है और [[रोग-प्रतिरोधक क्षमता|immunity]] भी कमज़ोर हो जाती है।",
 "किशोरों की नींद कम होने के कई कारण हैं। सबसे बड़ा कारण देर रात तक मोबाइल या कंप्यूटर की स्क्रीन देखना है, क्योंकि स्क्रीन की नीली रोशनी [[दिमाग़|brain]] को जगाए रखती है। इसके अलावा, कई विद्यार्थियों को स्कूल के बाद ट्यूशन जाना पड़ता है, जिससे [[गृहकार्य|homework]] देर रात तक चलता है। शाम को चाय, कॉफ़ी या [[ऊर्जा पेय|energy drinks]] पीना भी नींद में [[बाधा|obstacle]] डालता है। परीक्षा का [[तनाव|stress]] भी कई बच्चों को रात भर जगाए रखता है।",
