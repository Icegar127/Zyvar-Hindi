 source:"Official task from the 2027 specimen paper, Exercise 5",
 taskHi:"साइकिल चलाते समय आप अपनी साइकिल से गिर गए। अपने मित्र को यह बताने के लिए एक ईमेल लिखें।",
 taskEn:"You fell off your bicycle while riding it. Write an email to your friend to tell them about it.",
 bullets:[["वर्णन करें कि आप क्या कर रहे थे","describe what you were doing"],["क्या हुआ","what happened"],["आपने स्थिति का सामना कैसे किया","how you dealt with the situation"]],
 paras:[
 {tag:"Subject",hi:"विषय: पिछले रविवार की एक घटना",en:"Subject: Something that happened last Sunday"},
 {tag:"Greeting",hi:"प्रिय रोहन,\nनमस्ते! आशा है कि तुम ठीक होगे। मैं तुम्हें एक घटना के बारे में बताना चाहता हूँ जो पिछले रविवार को मेरे साथ हुई।",en:"Dear Rohan,\nHello! I hope you are well. I want to tell you about something that happened to me last Sunday."},
 {tag:"Point 1",hi:"उस दिन सुबह मौसम बहुत सुहावना था, {{इसलिए}} मैं अपनी नई साइकिल लेकर नदी के किनारे वाली सड़क पर घूमने निकला। <<मैं गाने सुनते हुए|Present participle with हुए: 'while listening'. Joining two actions in one sentence is a complex structure.>> काफ़ी तेज़ चला रहा था।",en:"The weather was lovely that morning, so I took my new bicycle out along the road by the river. I was riding quite fast while listening to songs."},
 {tag:"Point 2",hi:"{{अचानक}} एक कुत्ता सड़क के बीच में आ गया। <<उसे बचाने के लिए|Purpose phrase with के लिए: 'in order to save it'.>> मैंने ज़ोर से ब्रेक लगाया, {{लेकिन}} साइकिल फिसल गई और मैं सड़क पर गिर पड़ा। मेरे घुटने और कोहनी पर चोट लगी।",en:"Suddenly a dog came into the middle of the road. To avoid it I braked hard, but the bicycle slipped and I fell on the road. I hurt my knee and elbow."},
 {tag:"Point 3",hi:"{{पहले तो}} मैं घबरा गया, {{पर फिर}} मैंने हिम्मत से काम लिया। मैंने पिताजी को फ़ोन किया और वे तुरंत मुझे डॉक्टर के पास ले गए। अब मैं पहले से बेहतर हूँ। इस घटना से मैंने सीखा कि <<साइकिल चलाते समय हमेशा हेलमेट पहनना चाहिए।|चलाते समय ('while riding') plus चाहिए for advice: a lesson learned rounds off the story.>>",en:"At first I panicked, but then I acted bravely. I phoned my father and he took me to the doctor at once. I am better now. From this I learned that one should always wear a helmet while cycling."},
 {tag:"Closing",hi:"जल्दी जवाब देना।\nतुम्हारा दोस्त,\nआदित्य",en:"Reply soon.\nYour friend,\nAditya"}],
 notes:["All three bullet points are covered, each in its own paragraph, with detail (where, why, what was hurt).","Informal register throughout: तुम, a friendly greeting and a warm sign-off.","Past tense is accurate, with a range of structures: सुनते हुए, बचाने के लिए, चलाते समय.","Linking words move the story forward in time order: अचानक, पहले तो, पर फिर."]},

{id:"e-event",type:"email",title:"My part in the school function",official:false,
 taskHi:"हाल ही में आपने अपने स्कूल के एक कार्यक्रम में भाग लिया। अपनी बड़ी चचेरी बहन को इसके बारे में ईमेल लिखिए।",
 taskEn:"You recently took part in an event at your school. Write an email to your older cousin about it.",
 bullets:[["कार्यक्रम क्या था","what the event was"],["आपने उसमें क्या किया","what you did in it"],["आपको कैसा लगा और क्यों","how you felt and why"]],
 paras:[
 {tag:"Greeting",hi:"प्रिय नेहा दीदी,\nनमस्ते! आप कैसी हैं? बहुत दिनों से आपसे बात नहीं हुई, {{इसलिए}} सोचा कि ईमेल लिखकर एक अच्छी ख़बर सुनाऊँ।",en:"Dear Neha didi,\nHello! How are you? We have not spoken for a long time, so I thought I would write and share some good news."},
 {tag:"Point 1",hi:"पिछले शुक्रवार हमारे स्कूल में <<वार्षिकोत्सव|'Annual function': precise, less common vocabulary from the notes' school theme.>> मनाया गया। इसमें नृत्य, संगीत और नाटक के कई कार्यक्रम हुए, जिन्हें देखने के लिए सभी विद्यार्थियों के माता-पिता आए थे।",en:"Last Friday our school held its annual function. There were many dance, music and drama items, which all the students' parents came to watch."},
 {tag:"Point 2",hi:"मैंने अपनी कक्षा के नाटक में एक बूढ़े किसान की भूमिका निभाई। हमने तीन सप्ताह तक रोज़ अभ्यास किया था। मंच पर जाने से पहले मैं बहुत घबराई हुई थी, {{क्योंकि}} मुझे डर था कि मैं अपने संवाद भूल जाऊँगी।",en:"I played the role of an old farmer in my class play. We had practised every day for three weeks. Before going on stage I was very nervous, because I was afraid I would forget my lines."},
 {tag:"Point 3",hi:"{{लेकिन}} सब कुछ बहुत अच्छा रहा और दर्शकों ने खड़े होकर तालियाँ बजाईं। <<वह मेरे लिए गौरव का क्षण था।|'A moment of pride': a phrase from the notes that names the feeling precisely.>> मुझे अपने ऊपर गर्व महसूस हुआ, {{क्योंकि}} पहले मैं लोगों के सामने बोलने से डरती थी। अब मेरा आत्मविश्वास बढ़ गया है।",en:"But everything went very well and the audience stood and clapped. It was a moment of pride for me. I felt proud of myself, because earlier I was afraid of speaking in front of people. Now my confidence has grown."},
 {tag:"Closing",hi:"<<काश आप भी वहाँ होतीं!|A wish with काश + past subjunctive: an advanced structure.>> अगली छुट्टियों में ज़रूर आइएगा।\nआपकी छोटी बहन,\nसिया",en:"I wish you had been there too! Do come in the next holidays.\nYour younger sister,\nSiya"}],
 notes:["The writer uses आप, not तुम, because the reader is an older cousin. The email is still informal and warm.","The third bullet asks 'how you felt and why'. The model gives the feeling (गर्व) and the reason.","Less common vocabulary is used correctly: वार्षिकोत्सव, भूमिका, संवाद, दर्शक, आत्मविश्वास.","काश आप भी वहाँ होतीं shows a more complex structure."]},

{id:"e-invite",type:"email",title:"Inviting a friend for Diwali",official:false,
 source:"Built on Preset 1 (invitation) from the class notes",
 taskHi:"इस बार आपके घर पर दिवाली के अवसर पर एक छोटा सा उत्सव हो रहा है। अपने मित्र को आमंत्रित करते हुए ईमेल लिखिए।",
 taskEn:"This year a small Diwali celebration is being held at your home. Write an email inviting your friend.",
 bullets:[["उत्सव कब और कहाँ है","when and where the celebration is"],["उसमें क्या-क्या होगा","what will happen there"],["मित्र का आना आपके लिए क्यों ज़रूरी है","why it matters to you that your friend comes"]],
 paras:[
 {tag:"Subject",hi:"विषय: दिवाली के शुभ अवसर पर आमंत्रण",en:"Subject: An invitation on the happy occasion of Diwali"},
 {tag:"Greeting",hi:"प्रिय समीर,\nसस्नेह नमस्ते। आशा है तुम वहाँ सकुशल होगे। <<तुम्हें यह जानकर बहुत ख़ुशी होगी कि|Ready-made opener from the notes: 'You will be very happy to know that...'>> इस बार हमारे घर पर दिवाली का एक छोटा सा उत्सव <<आयोजित किया जा रहा है।|Passive continuous: 'is being organised'. Rare in student emails, so it stands out.>>",en:"Dear Sameer,\nWarm greetings. I hope you are well there. You will be very happy to know that this year a small Diwali celebration is being organised at our home."},
 {tag:"Point 1",hi:"यह उत्सव अगले शनिवार को शाम छह बजे से हमारे घर की छत पर होगा।",en:"The celebration will be next Saturday from six in the evening on our roof."},
 {tag:"Point 2",hi:"हमने शाम के लिए शानदार प्रबंध किया है। पहले लक्ष्मी पूजा होगी, {{फिर}} सब लोग मिलकर दीये जलाएँगे और रंगोली बनाएँगे। दादी ने अपने हाथों से स्वादिष्ट पकवान बनाने का वादा किया है, {{जबकि}} पापा संगीत की ज़िम्मेदारी संभालेंगे। <<हम सब मिलकर पुरानी यादें ताज़ा करेंगे।|Idiom from the notes: 'refresh old memories'.>>",en:"We have made grand arrangements for the evening. First there will be Lakshmi puja, then everyone will light lamps and make rangoli together. Grandmother has promised to cook delicious dishes herself, while Dad will take charge of the music. We will all refresh old memories together."},
 {tag:"Point 3",hi:"सच कहूँ तो <<तुम्हारे बिना मेरा यह उत्सव अधूरा रहेगा|'Without you my celebration will be incomplete': an expressive phrase from the notes.>>, {{क्योंकि}} पिछले पाँच सालों से हम <<हर दिवाली साथ मनाते आए हैं।|'Have been celebrating': the habitual perfect -ते आए हैं, a less common verb form.>> <<अगर तुम आओगे, तो त्योहार का मज़ा दोगुना हो जाएगा।|Conditional अगर ... तो with the idiom मज़ा दोगुना होना.>>",en:"To be honest, my celebration will be incomplete without you, because for the last five years we have celebrated every Diwali together. If you come, the fun of the festival will double."},
 {tag:"Closing",hi:"कृपया अपने आने के बारे में जल्द से जल्द बताना। घर में बड़ों को मेरा प्रणाम कहना।\nतुम्हारे आने की प्रतीक्षा रहेगी।\nतुम्हारा मित्र,\nआरव",en:"Please let me know as soon as possible whether you are coming. Give my respects to the elders at home.\nI will be waiting for you.\nYour friend,\nAarav"}],
 notes:["Every bullet gets its own paragraph, and each is developed: time and place, three activities, then a reason with history behind it.","The closing lines come straight from the notes: घर में बड़ों को मेरा प्रणाम कहना and तुम्हारे आने की प्रतीक्षा रहेगी.","Range of tenses: future (होगा), present perfect (बुलाया है), passive continuous, habitual perfect.","Linking words of time, contrast and reason: फिर, जबकि, क्योंकि, अगर ... तो."]},

{id:"e-apology",type:"email",title:"Sorry I missed your birthday",official:false,
 source:"Built on Preset 2 (apology) from the class notes",
 taskHi:"आप अपनी सहेली के जन्मदिन की पार्टी में नहीं जा सकीं। उसे ईमेल लिखिए।",
 taskEn:"You could not go to your friend's birthday party. Write her an email.",
 bullets:[["बधाई दें और न आने के लिए क्षमा माँगें","congratulate her and apologise for not coming"],["आप क्यों नहीं आ सकीं","why you could not come"],["आप यह कमी कैसे पूरी करेंगी","how you will make up for it"]],
 paras:[
 {tag:"Subject",hi:"विषय: जन्मदिन की पार्टी में न आ पाने के लिए क्षमा याचना",en:"Subject: Apologies for not making it to your birthday party"},
 {tag:"Greeting",hi:"प्रिय अनन्या,\nमधुर यादें। आशा है तुम सकुशल होगी। सबसे पहले तुम्हें तुम्हारे पंद्रहवें जन्मदिन की बहुत-बहुत बधाई! <<मुझे बेहद अफ़सोस है कि|'I am extremely sorry that': stronger and more mature than a plain 'sorry'.>> मैं तुम्हारे इस विशेष दिन पर वहाँ उपस्थित नहीं हो सकी।",en:"Dear Ananya,\nFond memories. I hope you are well. First of all, many happy returns on your fifteenth birthday! I am extremely sorry that I could not be there on your special day."},
 {tag:"Reason",hi:"<<दरअसल, ऐन वक़्त पर|'Actually, at the very last moment': a natural, idiomatic connector from the notes.>> मेरी तबीयत अचानक ख़राब हो गई। मुझे तेज़ बुख़ार था, {{इसलिए}} डॉक्टर ने पूरा दिन आराम करने की सलाह दी। <<मैंने तुम्हारे लिए जो तोहफ़ा ख़रीदा था, वह|Relative-correlative जो ... वह: 'the present that I had bought'.>> भी मेरी मेज़ पर ही रखा रह गया। <<मैं चाहकर भी इस ख़ुशी का हिस्सा नहीं बन पाई|चाहकर भी: 'even though I wanted to'. A hallmark of top-band language.>>, इसका मुझे बेहद खेद है।",en:"Actually, at the very last moment I suddenly fell ill. I had a high fever, so the doctor told me to rest all day. Even the present I had bought for you stayed lying on my desk. Even though I wanted to, I could not be part of the celebration, and I deeply regret it."},
 {tag:"Making up",hi:"मुझे उम्मीद है कि तुम मेरी मजबूरी समझोगी और मुझे माफ़ कर दोगी। <<जैसे ही मैं पूरी तरह ठीक हो जाऊँगी, वैसे ही|जैसे ही ... वैसे ही: 'as soon as ... (then)'. A paired connector examiners reward.>> तुम्हारा तोहफ़ा लेकर तुम्हारे घर आऊँगी। {{इसके अलावा}}, अगले रविवार मैं तुम्हें तुम्हारी पसंदीदा दुकान पर आइसक्रीम खिलाने ले चलूँगी, {{ताकि}} हम मिलकर तुम्हारा जन्मदिन फिर से मना सकें।",en:"I hope you will understand my situation and forgive me. As soon as I am completely well, I will come to your house with your present. Besides, next Sunday I will take you for ice cream at your favourite shop, so that we can celebrate your birthday again together."},
 {tag:"Closing",hi:"तुम्हारी प्रिय सहेली,\nकविता",en:"Your dear friend,\nKavita"}],
 notes:["The first bullet has two parts (congratulate and apologise). Both are done in the opening paragraph.","The reason is specific (fever, doctor's advice) and the regret is developed, not just stated.","Feminine verb endings are consistent: सकी, बन पाई, जाऊँगी, ले चलूँगी. Agreement errors here cost language marks.","Sophisticated phrases from the notes: ऐन वक़्त पर, चाहकर भी, मजबूरी समझोगी."]},

{id:"e-advice",type:"email",title:"Advice for exam stress",official:false,
 source:"Built on Preset 3 (advice) from the class notes",
 taskHi:"आपके मित्र ने आपको बताया है कि वह आने वाली परीक्षाओं को लेकर बहुत तनाव में है। उसे सलाह देते हुए ईमेल लिखिए।",
 taskEn:"Your friend has told you he is very stressed about the coming exams. Write him an email giving advice.",
 bullets:[["उसकी समस्या के बारे में आपको कैसा लगा","how you felt about his problem"],["पढ़ाई के लिए सुझाव","suggestions for studying"],["स्वास्थ्य और आराम के लिए सुझाव","suggestions for health and rest"]],
 paras:[
 {tag:"Subject",hi:"विषय: परीक्षा के तनाव के संबंध में कुछ सुझाव",en:"Subject: Some suggestions about exam stress"},
 {tag:"Greeting",hi:"प्रिय कबीर,\nसप्रेम नमस्ते। मैं यहाँ कुशल हूँ और तुम्हारी कुशलता की कामना करता हूँ। <<तुम्हारे पिछले ईमेल से मुझे पता चला कि|'From your last email I learned that': a smooth way into the task, from the notes.>> तुम आगामी परीक्षाओं को लेकर बहुत तनाव में हो। यह पढ़कर मुझे चिंता हुई।",en:"Dear Kabir,\nWarm greetings. I am well here and wish the same for you. From your last email I learned that you are very stressed about the coming exams. Reading this worried me."},
 {tag:"Study",hi:"<<एक सच्चे मित्र के नाते|के नाते: 'in the capacity of, as'. Formal-sounding but natural.>> मैं तुम्हें कुछ सुझाव देना चाहता हूँ। {{सबसे पहले}}, पूरे पाठ्यक्रम को छोटे-छोटे हिस्सों में बाँटकर एक समय-सारणी बनाओ। रोज़ सुबह जल्दी उठकर कठिन विषय पढ़ो, {{क्योंकि}} उस समय दिमाग़ तरोताज़ा रहता है।",en:"As a true friend, I want to give you some suggestions. First, divide the whole syllabus into small parts and make a timetable. Get up early every morning and study the hard subjects, because the mind is fresh then."},
 {tag:"Health",hi:"{{साथ ही}}, अपने स्वास्थ्य को नज़रअंदाज़ मत करना। <<जैसा कि कहा गया है, 'पहला सुख नीरोगी काया'|A well-known saying quoted correctly: 'health is the first happiness'. Shows range.>>, {{इसलिए}} संतुलित आहार लो, आठ घंटे सोओ और रोज़ थोड़ा टहलो। <<बीच-बीच में आराम करना भी उतना ही ज़रूरी है जितना पढ़ना।|Comparison of equality: उतना ही ... जितना.>> <<अगर तुम मेरी इस सलाह पर ध्यान दोगे, तो|Conditional sentence about the future.>> तुम्हारा तनाव अपने आप कम हो जाएगा।",en:"Also, do not ignore your health. As the saying goes, 'health is the first happiness', so eat a balanced diet, sleep eight hours and walk a little every day. Resting now and then is just as important as studying. If you pay attention to my advice, your stress will go down by itself."},
 {tag:"Closing",hi:"इस बारे में तुम्हारे क्या विचार हैं? मुझे अपने जवाब से अवगत कराना।\nतुम्हारा शुभचिंतक,\nदेव",en:"What do you think about this? Let me know your reply.\nYour well-wisher,\nDev"}],
 notes:["The first bullet asks about feelings. The model answers it directly: यह पढ़कर मुझे चिंता हुई.","Advice uses a range of forms: commands (बनाओ, पढ़ो), negative command (मत करना), and चाहिए-style advice.","A saying and a comparison structure lift the language into the top band.","The sign-off शुभचिंतक (well-wisher) matches the advice-giving purpose."]},

{id:"e-trip",type:"email",title:"Our trip to Udaipur",official:false,
 source:"Uses the Travel theme vocabulary from the class notes",
 taskHi:"आप हाल ही में अपने परिवार के साथ किसी पर्यटन स्थल पर घूमने गईं। अपने चचेरे भाई को इस यात्रा के बारे में ईमेल लिखिए।",
 taskEn:"You recently went to a tourist spot with your family. Write an email to your cousin about the trip.",
 bullets:[["आप कहाँ गईं और वहाँ कैसे पहुँचीं","where you went and how you got there"],["वहाँ आपको सबसे अच्छा क्या लगा","what you liked most there"],["अगली बार आप उसे साथ क्यों ले जाना चाहेंगी","why you would like to take him next time"]],
 paras:[
 {tag:"Greeting",hi:"प्रिय रोहन भैया,\nनमस्ते! आशा है आप स्वस्थ होंगे। मैं आपको अपनी उदयपुर यात्रा के बारे में बताना चाहती हूँ, जो सचमुच एक <<अविस्मरणीय अनुभव|'Unforgettable experience': a strong, less common adjective from the travel theme.>> रही।",en:"Dear Rohan bhaiya,\nHello! I hope you are well. I want to tell you about my Udaipur trip, which was truly an unforgettable experience."},
 {tag:"Point 1",hi:"पिछले महीने दिवाली की छुट्टियों में हम राजस्थान के 'झीलों के शहर' उदयपुर गए। दिल्ली से हमने रात की ट्रेन ली और सुबह-सुबह वहाँ पहुँच गए। <<स्टेशन से बाहर निकलते ही|-ते ही: 'as soon as we came out'. A compact, advanced structure.>> ठंडी हवा ने हमारा स्वागत किया।",en:"Last month, in the Diwali holidays, we went to Udaipur, the 'city of lakes' in Rajasthan. We took the night train from Delhi and arrived early in the morning. As soon as we stepped out of the station, a cool breeze welcomed us."},
 {tag:"Point 2",hi:"वहाँ का प्राकृतिक सौंदर्य और ऐतिहासिक स्थल दोनों ही देखने लायक़ हैं। {{हालाँकि}} सिटी पैलेस बहुत भव्य था, {{फिर भी}} मुझे सबसे अधिक पिछोला झील पर नाव की सवारी पसंद आई। <<सूर्यास्त के समय झील के मनोरम दृश्यों ने मेरा मन मोह लिया।|Idiom from the notes: मन मोह लेना, 'to captivate'.>>",en:"Both the natural beauty and the historic sites there are worth seeing. Although the City Palace was magnificent, I liked the boat ride on Lake Pichola most of all. At sunset the beautiful views of the lake captivated me."},
 {tag:"Point 3",hi:"<<मैं चाहती हूँ कि अगली बार आप भी हमारे साथ चलें|चाहना कि + subjunctive (चलें): 'I want you to come'.>>, {{क्योंकि}} आपको इतिहास और फ़ोटोग्राफ़ी दोनों का शौक़ है। अगर आप साथ होंगे, तो यात्रा का मज़ा दोगुना हो जाएगा। यह यात्रा हमें रोज़मर्रा की भागदौड़ से एक अच्छा विश्राम भी देगी।",en:"I want you to come with us next time, because you love both history and photography. If you are with us, the fun of the trip will double. The trip will also give us a good rest from our hectic daily routine."},
 {tag:"Closing",hi:"अपने विचार ज़रूर बताइएगा।\nआपकी छोटी बहन,\nप्रिया",en:"Do tell me what you think.\nYour younger sister,\nPriya"}],
 notes:["आप is used for an older cousin, and the verb forms match (चलें, बताइएगा).","The notes' phrase uses the English word 'break'. This model uses विश्राम instead, following the notes' own tip to avoid English words in Hindi script where a Hindi word exists.","Contrast is handled with हालाँकि ... फिर भी, a paired connector.","Travel vocabulary from the notes: पर्यटन स्थल, प्राकृतिक सौंदर्य, ऐतिहासिक स्थल, अविस्मरणीय, मनोरम दृश्य."]},

{id:"e-festival",type:"email",title:"How we celebrated Holi",official:false,
 source:"Uses the Festivals theme vocabulary from the class notes",
 taskHi:"आपका एक मित्र विदेश में रहता है और उसने कभी होली नहीं देखी। उसे ईमेल लिखकर बताइए कि आपने इस साल होली कैसे मनाई।",
 taskEn:"A friend of yours lives abroad and has never seen Holi. Write an email telling him how you celebrated Holi this year.",
 bullets:[["त्योहार से पहले की तैयारियाँ","preparations before the festival"],["त्योहार का दिन कैसे बीता","how the festival day went"],["यह त्योहार आपके लिए क्यों ख़ास है","why this festival is special to you"]],
 paras:[
 {tag:"Greeting",hi:"प्रिय टॉम,\nनमस्ते! तुम्हारा ईमेल मिला, पढ़कर बहुत ख़ुशी हुई। तुमने पूछा था कि होली क्या होती है, {{इसलिए}} आज मैं तुम्हें इस साल की अपनी होली के बारे में विस्तार से बताता हूँ।",en:"Dear Tom,\nHello! I got your email and was very happy to read it. You asked what Holi is, so today I will tell you in detail about my Holi this year."},
 {tag:"Point 1",hi:"होली से एक हफ़्ता पहले ही घर में तैयारियाँ शुरू हो गई थीं। माँ और दादी ने गुजिया और नमकीन जैसे <<पारंपरिक पकवान|'Traditional dishes': precise festival vocabulary from the notes.>> बनाए, {{जबकि}} मैंने और मेरी बहन ने बाज़ार से प्राकृतिक रंग और पिचकारियाँ ख़रीदीं।",en:"Preparations at home began a whole week before Holi. Mum and Grandmother made traditional dishes like gujiya and namkeen, while my sister and I bought natural colours and water pistols at the market."},
 {tag:"Point 2",hi:"<<त्योहार के दिन चारों ओर उत्साह और ख़ुशी का माहौल था।|Ready-made phrase from the notes: 'an atmosphere of enthusiasm and joy everywhere'.>> सुबह से ही दोस्त एक-दूसरे को रंग लगाने आने लगे। हमने ढोल की थाप पर नाच-गाना किया और <<दोपहर तक हम सब पहचान में ही नहीं आ रहे थे!|A vivid, humorous detail that develops the content.>>",en:"On the day of the festival there was an atmosphere of enthusiasm and joy all around. From the morning, friends started coming to put colour on one another. We danced and sang to the beat of the drum, and by afternoon none of us could even be recognised!"},
 {tag:"Point 3",hi:"मेरे लिए यह त्योहार इसलिए ख़ास है, {{क्योंकि}} <<इस दिन लोग पुराने झगड़े भुलाकर गले मिलते हैं।|Conjunctive participle -कर (भुलाकर) joining two actions.>> {{इसके अलावा}}, यह वसंत के आगमन का भी प्रतीक है। <<काश, तुम भी यहाँ होते!|A wish with काश.>>",en:"This festival is special to me because on this day people forget old quarrels and embrace. Besides, it also marks the arrival of spring. I wish you had been here too!"},
 {tag:"Closing",hi:"अगले साल होली पर ज़रूर आना।\nतुम्हारा दोस्त,\nविवान",en:"Do come next year for Holi.\nYour friend,\nVivaan"}],
 notes:["The reader has never seen Holi, so the email explains (गुजिया, पिचकारियाँ, ढोल) without becoming a textbook.","Each bullet has a paragraph with specific, sensory details.","इसलिए ... क्योंकि is used correctly to give a reason.","Range: past perfect (शुरू हो गई थीं), past continuous (नहीं आ रहे थे), present habitual, and a wish."]},

{id:"e-hobby",type:"email",title:"My new hobby: the guitar",official:false,
 taskHi:"आपने हाल ही में एक नया शौक़ शुरू किया है। अपनी सहेली को ईमेल लिखिए।",
 taskEn:"You have recently started a new hobby. Write an email to your friend.",
 bullets:[["शौक़ क्या है","what the hobby is"],["आपने इसे क्यों शुरू किया","why you started it"],["आपकी सहेली को भी इसे क्यों आज़माना चाहिए","why your friend should try it too"]],
 paras:[
 {tag:"Greeting",hi:"प्रिय मीरा,\nनमस्ते! बहुत दिनों से तुमसे बात नहीं हुई। आशा है तुम्हारी पढ़ाई अच्छी चल रही होगी। आज मैं तुम्हें अपने नए शौक़ के बारे में बताना चाहती हूँ।",en:"Dear Meera,\nHello! We have not talked for ages. I hope your studies are going well. Today I want to tell you about my new hobby."},
 {tag:"Point 1",hi:"<<पिछले दो महीनों से मैं गिटार बजाना सीख रही हूँ।|से + present continuous: 'I have been learning for two months'. Hindi uses the present tense here, which many learners get wrong.>> हर मंगलवार और शुक्रवार शाम को मैं पास के संगीत विद्यालय जाती हूँ और बाक़ी दिनों में घर पर आधा घंटा अभ्यास करती हूँ।",en:"For the last two months I have been learning the guitar. Every Tuesday and Friday evening I go to the music school nearby, and on other days I practise at home for half an hour."},
 {tag:"Point 2",hi:"दरअसल, इस साल परीक्षाओं के कारण मैं बहुत तनाव में रहती थी, {{इसलिए}} <<मैं कोई ऐसा काम ढूँढ रही थी जिससे मन हल्का हो सके।|ऐसा ... जिससे: a relative clause of purpose.>> <<जब मैं गिटार बजाती हूँ, तो मेरे मन को बहुत शांति मिलती है।|जब ... तो, plus the notes' phrase मन को शांति मिलना.>> {{इसके अलावा}}, यह समय का सदुपयोग भी है।",en:"Actually, this year I was very stressed because of exams, so I was looking for something that would lighten my mind. When I play the guitar, my mind feels very peaceful. Besides, it is also a good use of time."},
 {tag:"Point 3",hi:"मुझे लगता है कि तुम्हें भी कोई वाद्य-यंत्र सीखना चाहिए, {{क्योंकि}} तुम्हारी आवाज़ बहुत मधुर है। <<अगर हम दोनों साथ अभ्यास करें, तो|Hypothetical condition with the subjunctive करें.>> स्कूल के वार्षिकोत्सव में मिलकर प्रस्तुति दे सकती हैं। सोचो, कितना मज़ा आएगा!",en:"I think you should learn an instrument too, because your voice is very sweet. If we both practise together, we could perform together at the school annual function. Imagine how much fun it would be!"},
 {tag:"Closing",hi:"जवाब का इंतज़ार रहेगा।\nतुम्हारी सहेली,\nसना",en:"I will wait for your reply.\nYour friend,\nSana"}],
 notes:["The reason is personal and believable (exam stress), which gives the email an excellent sense of purpose.","The third bullet is persuasive: a compliment, a plan and an exclamation.","Theme vocabulary from the notes: शौक़, समय का सदुपयोग, मन को शांति मिलना.","Correct use of से with a present continuous verb for an action still going on."]},

/* ======== EXERCISE 6: REPORTS ======== */
{id:"r-survey",type:"report",title:"Young people and university",official:true,
 source:"Official task from the 2027 specimen paper, Exercise 6",
 taskHi:"18–24 वर्ष के दो हज़ार युवाओं के एक सर्वेक्षण के अनुसार, 32 प्रतिशत का कहना था कि वे विश्वविद्यालय नहीं जाना चाहते हैं। उच्च शिक्षा के प्रति उनके दृष्टिकोण और उसे बदलने के लिए सुझाव देने के बारे में अपने स्थानीय समाचार पत्र के लिए एक रिपोर्ट लिखिए।",
 taskEn:"A survey of 2,000 young people aged 18 to 24 found that 32 per cent do not want to go to university. Write a report for your local newspaper about their attitude to higher education, with suggestions to change it. Classmates' comments in the task mention high cost, unemployed graduates, lifelong student loans and fierce competition for good institutions.",
 bullets:[["युवाओं का दृष्टिकोण और उसके कारण","their attitude and the reasons"],["उसे बदलने के लिए सुझाव","suggestions to change it"]],
 paras:[
 {tag:"Title",hi:"उच्च शिक्षा से दूर होते युवा",en:"Young people turning away from higher education"},
 {tag:"Introduction",hi:"18 से 24 वर्ष के दो हज़ार युवाओं पर <<एक सर्वेक्षण किया गया।|Passive voice: the standard, impersonal tone for a report.>> {{इसके अनुसार}} 32 प्रतिशत युवा विश्वविद्यालय नहीं जाना चाहते। यह रिपोर्ट इसके कारणों और समाधानों पर प्रकाश डालती है।",en:"A survey was carried out among two thousand young people aged 18 to 24. According to it, 32 per cent do not want to go to university. This report sheds light on the reasons and the solutions."},
 {tag:"Findings",hi:"सर्वेक्षण से पता चलता है कि सबसे बड़ा कारण उच्च शिक्षा की बढ़ती लागत है। अनेक विद्यार्थियों को ऋण लेना पड़ता है, जिसे चुकाने में कई वर्ष लग जाते हैं। {{इसके अतिरिक्त}}, बहुत से स्नातकों को डिग्री के बाद भी नौकरी नहीं मिलती। <<परिणामस्वरूप|'As a result': a formal cause-and-effect connector.>> युवाओं को लगता है कि विश्वविद्यालय जाना समय और धन की बर्बादी है।",en:"The survey shows that the biggest reason is the rising cost of higher education. Many students have to take loans that take years to repay. In addition, many graduates do not find a job even after their degree. As a result, young people feel university is a waste of time and money."},
 {tag:"Suggestions",hi:"इस दृष्टिकोण को बदलने के लिए कुछ कदम उठाए जा सकते हैं। {{सबसे पहले}}, सरकार को ज़रूरतमंद विद्यार्थियों के लिए छात्रवृत्तियाँ बढ़ानी चाहिए। {{दूसरे}}, विश्वविद्यालयों को ऐसे पाठ्यक्रम शुरू करने चाहिए जो सीधे रोज़गार से जुड़े हों। {{अंत में}}, <<स्कूलों में करियर के बारे में सही मार्गदर्शन दिया जाना चाहिए।|Passive obligation दिया जाना चाहिए: formal and impersonal.>>",en:"Some steps can be taken to change this attitude. First, the government should increase scholarships for students in need. Second, universities should start courses linked directly to employment. Finally, schools should give proper career guidance."},
 {tag:"Conclusion",hi:"निष्कर्ष यह है कि <<यदि शिक्षा सस्ती और उपयोगी बने, तो|Formal conditional with यदि ... तो and the subjunctive बने.>> अधिक युवा उसे अपनाएँगे।",en:"The conclusion is that if education becomes affordable and useful, more young people will take it up."}],
 notes:["A report is factual. There is no 'I' and no greeting; it has a title and clear sections.","It uses ideas from the comments in the task and adds its own (scholarships, career guidance), as the task asks.","Formal vocabulary: सर्वेक्षण, ऋण, स्नातक, दृष्टिकोण, मार्गदर्शन.","Suggestions are ordered with सबसे पहले, दूसरे, अंत में."]},

{id:"r-trip",type:"report",title:"Class trip to the science centre",official:false,
 taskHi:"आपकी कक्षा हाल ही में एक विज्ञान केंद्र की शैक्षिक यात्रा पर गई थी। अपने प्रधानाचार्य के लिए इस यात्रा पर एक रिपोर्ट लिखिए।",
 taskEn:"Your class recently went on an educational trip to a science centre. Write a report on the trip for your head teacher.",
 bullets:[["यात्रा कहाँ और कब हुई","where and when the trip took place"],["विद्यार्थियों ने क्या सीखा","what students learned"],["अगली यात्रा के लिए सुझाव","suggestions for the next trip"]],
 paras:[
 {tag:"Title",hi:"विज्ञान केंद्र की शैक्षिक यात्रा: एक रिपोर्ट",en:"Educational trip to the science centre: a report"},
 {tag:"Introduction",hi:"यह रिपोर्ट कक्षा दस की उस शैक्षिक यात्रा के बारे में है, जो पंद्रह अक्टूबर को नगर विज्ञान केंद्र में <<आयोजित की गई।|Passive voice, standard for a report.>> इस यात्रा में चालीस विद्यार्थियों और तीन अध्यापकों ने भाग लिया।",en:"This report is about the Class 10 educational trip that was organised to the city science centre on 15 October. Forty students and three teachers took part."},
 {tag:"Findings",hi:"विज्ञान केंद्र में विद्यार्थियों ने अंतरिक्ष, ऊर्जा और मानव शरीर से जुड़ी प्रदर्शनियाँ देखीं। तारामंडल में दिखाई गई फ़िल्म सबसे अधिक लोकप्रिय रही। {{इसके अतिरिक्त}}, विद्यार्थियों ने स्वयं छोटे प्रयोग भी किए, <<जिससे किताबों में पढ़े सिद्धांत उन्हें व्यवहार में समझ आए।|Relative clause with जिससे showing a result.>> {{हालाँकि}}, कुछ विद्यार्थियों ने शिकायत की कि भोजन के लिए दिया गया समय बहुत कम था।",en:"At the centre, students saw exhibitions on space, energy and the human body. The film shown in the planetarium was the most popular. In addition, students did small experiments themselves, which helped them understand in practice the principles they had read in books. However, some students complained that the time given for lunch was too short."},
 {tag:"Suggestions",hi:"अगली यात्राओं को और सफल बनाने के लिए कुछ सुझाव प्रस्तुत हैं। {{सबसे पहले}}, <<यात्रा से पहले विद्यार्थियों को एक प्रश्न-पत्र दिया जाए|Passive subjunctive दिया जाए: a polite, formal way to recommend.>>, {{ताकि}} वे ध्यान से जानकारी इकट्ठा करें। {{दूसरे}}, भोजन के लिए कम से कम पैंतालीस मिनट का समय रखा जाए।",en:"Some suggestions are offered to make future trips more successful. First, students should be given a question sheet before the trip, so that they collect information carefully. Second, at least forty-five minutes should be allowed for lunch."},
 {tag:"Conclusion",hi:"<<कुल मिलाकर, यह यात्रा ज्ञानवर्धक और प्रेरणादायक रही।|Summing up with two compound adjectives: ज्ञानवर्धक (informative), प्रेरणादायक (inspiring).>>",en:"Overall, the trip was informative and inspiring."}],
 notes:["Written for the head teacher, so it is formal and impersonal throughout.","It reports a problem honestly (short lunch break) and links it to a suggestion.","Recommendations use the passive subjunctive (दिया जाए, रखा जाए), the most formal way to suggest.","Clear structure: title, introduction, findings, suggestions, conclusion."]},

{id:"r-trees",type:"report",title:"Tree-planting drive on Environment Day",official:false,
 taskHi:"आपके विद्यालय ने विश्व पर्यावरण दिवस पर एक वृक्षारोपण अभियान चलाया। विद्यालय की पत्रिका के लिए इस अभियान पर रिपोर्ट लिखिए।",
 taskEn:"Your school ran a tree-planting drive on World Environment Day. Write a report on the drive for the school magazine.",
 bullets:[["अभियान में क्या-क्या हुआ","what happened during the drive"],["लोगों की प्रतिक्रिया","how people responded"],["भविष्य के लिए सुझाव","suggestions for the future"]],
 paras:[
 {tag:"Title",hi:"पर्यावरण दिवस पर वृक्षारोपण अभियान",en:"Tree-planting drive on Environment Day"},
 {tag:"Introduction",hi:"पाँच जून को विश्व पर्यावरण दिवस के अवसर पर हमारे विद्यालय की पर्यावरण समिति ने एक वृक्षारोपण अभियान चलाया। <<इस रिपोर्ट में अभियान की मुख्य गतिविधियों और परिणामों का विवरण दिया गया है।|Passive present perfect: a formal way to state the report's purpose.>>",en:"On 5 June, World Environment Day, our school's environment committee ran a tree-planting drive. This report describes the main activities and results of the drive."},
 {tag:"Events",hi:"सुबह आठ बजे प्रधानाचार्या ने अभियान का उद्घाटन किया। {{इसके बाद}} विद्यार्थियों ने विद्यालय के आसपास की सड़कों पर नीम, पीपल और आम के दो सौ पौधे लगाए। <<प्रत्येक पौधे की देखभाल की ज़िम्मेदारी एक विद्यार्थी को सौंपी गई।|Passive with सौंपना ('to entrust'): precise, formal vocabulary.>>",en:"At eight in the morning the principal opened the drive. After this, students planted two hundred neem, peepal and mango saplings on the roads around the school. Each sapling was entrusted to one student's care."},
 {tag:"Response",hi:"स्थानीय निवासियों ने अभियान की बहुत प्रशंसा की। <<न केवल अभिभावकों ने, बल्कि आसपास के दुकानदारों ने भी|न केवल ... बल्कि ... भी: one of the most rewarded linking structures.>> पौधों को पानी देने का वचन दिया।",en:"Local residents praised the drive greatly. Not only parents but also nearby shopkeepers promised to water the saplings."},
 {tag:"Suggestions",hi:"{{फिर भी}}, कुछ सुधार आवश्यक हैं। पौधों की सुरक्षा के लिए उनके चारों ओर जालियाँ लगाई जानी चाहिए, {{क्योंकि}} आवारा पशु उन्हें नुक़सान पहुँचा सकते हैं। {{इसके अतिरिक्त}}, हर तीन महीने में पौधों की स्थिति की जाँच की जाए।",en:"Even so, some improvements are needed. Guards should be put around the saplings to protect them, because stray animals can damage them. In addition, the condition of the saplings should be checked every three months."},
 {tag:"Conclusion",hi:"<<निष्कर्षतः|'In conclusion': a formal one-word connector.>>, यह अभियान पर्यावरण संरक्षण की दिशा में एक सराहनीय कदम सिद्ध हुआ।",en:"In conclusion, the drive proved a praiseworthy step towards protecting the environment."}],
 notes:["Facts first (date, numbers, activities), then response, then suggestions: exactly what the glossary says a report does.","Environment vocabulary: वृक्षारोपण, पर्यावरण संरक्षण, सराहनीय, आवारा पशु.","न केवल ... बल्कि ... भी is used accurately.","Ends with a formal one-line conclusion."]},

{id:"r-canteen",type:"report",title:"Student views on the school canteen",official:false,
 taskHi:"प्रधानाचार्य ने छात्र परिषद से विद्यालय की कैंटीन के भोजन पर विद्यार्थियों की राय जानने को कहा है। प्रधानाचार्य के लिए एक रिपोर्ट लिखिए।",
 taskEn:"The head teacher has asked the student council to find out students' views on the canteen food. Write a report for the head teacher.",
 bullets:[["विद्यार्थियों को क्या पसंद नहीं है","what students do not like"],["कैंटीन की अच्छी बातें","the canteen's good points"],["सुधार के सुझाव","suggestions for improvement"]],
 paras:[
 {tag:"Title",hi:"विद्यालय की कैंटीन: विद्यार्थियों की राय",en:"The school canteen: students' views"},
 {tag:"Introduction",hi:"प्रधानाचार्य महोदय के निर्देश पर छात्र परिषद ने कक्षा छह से दस के तीन सौ विद्यार्थियों का सर्वेक्षण किया। <<यह रिपोर्ट उसके मुख्य निष्कर्ष प्रस्तुत करती है।|Impersonal statement of purpose: typical report style.>>",en:"At the head teacher's request, the student council surveyed three hundred students from Classes 6 to 10. This report presents its main findings."},
 {tag:"Findings",hi:"सर्वेक्षण से पता चला कि साठ प्रतिशत विद्यार्थी कैंटीन के भोजन से संतुष्ट नहीं हैं। उनका कहना है कि भोजन में तली हुई चीज़ें अधिक होती हैं, {{जबकि}} फल और सलाद बहुत कम मिलते हैं। <<इसके परिणामस्वरूप|Formal cause-and-effect connector.>> कई विद्यार्थी बाहर से जंक फ़ूड ख़रीदने लगे हैं, <<जिसका उनके स्वास्थ्य पर नकारात्मक प्रभाव पड़ता है।|Relative clause plus the notes' phrase नकारात्मक प्रभाव पड़ना.>> {{दूसरी ओर}}, अधिकांश विद्यार्थियों ने कैंटीन की सफ़ाई और कर्मचारियों के व्यवहार की प्रशंसा की।",en:"The survey found that sixty per cent of students are not satisfied with the canteen food. They say there is too much fried food, while fruit and salad are rarely available. As a result, many students have started buying junk food outside, which has a negative effect on their health. On the other hand, most students praised the canteen's cleanliness and the staff's behaviour."},
 {tag:"Suggestions",hi:"छात्र परिषद के निम्नलिखित सुझाव हैं। {{पहला}}, सप्ताह में कम से कम तीन दिन संतुलित आहार उपलब्ध कराया जाए। {{दूसरा}}, भोजन-सूची तय करते समय विद्यार्थियों की राय ली जाए। <<यदि ये कदम उठाए जाते हैं, तो|A conditional in the passive: sophisticated and formal.>> विद्यार्थी स्वस्थ और ऊर्जावान रहेंगे।",en:"The student council makes the following suggestions. First, a balanced diet should be available at least three days a week. Second, students' views should be taken when the menu is decided. If these steps are taken, students will stay healthy and energetic."},
 {tag:"Conclusion",hi:"आशा है कि प्रशासन इन सुझावों पर शीघ्र विचार करेगा।",en:"It is hoped that the administration will consider these suggestions soon."}],
 notes:["Balanced: it reports what students dislike and what they praise.","Numbers make the findings precise (तीन सौ, साठ प्रतिशत).","Health vocabulary from the notes: संतुलित आहार, नकारात्मक प्रभाव, ऊर्जावान.","The closing sentence is formal and polite without using 'I'."]},

/* ======== EXERCISE 6: ARTICLES ======== */
{id:"a-phones",type:"article",title:"Teenagers and mobile phones",official:false,
 taskHi:"आपकी स्कूल पत्रिका ‘किशोर और मोबाइल फ़ोन’ विषय पर लेख आमंत्रित कर रही है। अपने विचार देते हुए एक लेख लिखिए।",
 taskEn:"Your school magazine is collecting articles on 'Teenagers and mobile phones'. Write an article giving your views.",
 bullets:[["मोबाइल फ़ोन के फ़ायदे","benefits of mobile phones"],["उनके नुक़सान","their drawbacks"],["आपकी राय और सुझाव","your opinion and a suggestion"]],
 paras:[
 {tag:"Title",hi:"मोबाइल फ़ोन: दोस्त या दुश्मन?",en:"The mobile phone: friend or enemy?"},
 {tag:"Hook",hi:"<<क्या आप सुबह उठते ही सबसे पहले अपना फ़ोन देखते हैं?|An opening question speaks directly to the reader: right for an article.>> {{यदि}} हाँ, {{तो}} आप अकेले नहीं हैं। आज मोबाइल फ़ोन हम किशोरों के जीवन का ज़रूरी हिस्सा बन गया है।",en:"Do you look at your phone the moment you wake up? If so, you are not alone. Today the mobile phone has become an essential part of our lives as teenagers."},
 {tag:"One side",hi:"<<इसमें कोई संदेह नहीं कि|'There is no doubt that': a formal opener for a point.>> फ़ोन के कई फ़ायदे हैं। इसकी मदद से हम पढ़ाई के लिए जानकारी खोज सकते हैं और दूर रहने वाले रिश्तेदारों से बात कर सकते हैं। {{इसके अलावा}}, मुसीबत के समय यह बहुत काम आता है।",en:"There is no doubt that phones have many benefits. With their help we can find information for our studies and talk to relatives who live far away. Besides, they are very useful in an emergency."},
 {tag:"Other side",hi:"{{दूसरी ओर}}, फ़ोन का अधिक उपयोग हानिकारक भी है। <<जो विद्यार्थी देर रात तक फ़ोन चलाते हैं, उनकी नींद पूरी नहीं होती|Relative-correlative जो ... उनकी.>> और वे कक्षा में ध्यान नहीं दे पाते। {{साथ ही}}, हम अपने परिवार के साथ कम समय बिताने लगे हैं।",en:"On the other hand, too much phone use is also harmful. Students who use their phones late at night do not get enough sleep and cannot concentrate in class. Also, we have started spending less time with our families."},
 {tag:"Opinion",hi:"मेरे विचार से <<फ़ोन बुरा नहीं है, बल्कि उसका दुरुपयोग बुरा है।|नहीं ... बल्कि with the notes' word दुरुपयोग (misuse).>> {{इसलिए}} हमें उसके लिए एक समय तय करना चाहिए। आइए, इस सप्ताह से खाने की मेज़ पर फ़ोन न लाने का नियम बनाएँ!",en:"In my view the phone is not bad; rather, its misuse is bad. So we should fix a time for it. Come, let us make a rule from this week not to bring phones to the dinner table!"}],
 notes:["An article needs a title and an opening that catches the reader. Here it is a direct question.","The writer speaks to the readers (आप, हम किशोर), which suits a school magazine.","Both sides are developed with examples before the opinion is given.","It ends with a call to action, a common way to close an article."]},

{id:"a-water",type:"article",title:"Every drop counts",official:false,
 taskHi:"आपकी स्कूल पत्रिका ‘जल बचाओ’ विषय पर लेख आमंत्रित कर रही है। एक लेख लिखिए।",
 taskEn:"Your school magazine is inviting articles on 'Save water'. Write an article.",
 bullets:[["पानी की कमी की समस्या","the problem of water shortage"],["इसके कारण","its causes"],["विद्यार्थी क्या कर सकते हैं","what students can do"]],
 paras:[
 {tag:"Title",hi:"हर बूँद क़ीमती है",en:"Every drop is precious"},
 {tag:"Hook",hi:"<<कल्पना कीजिए कि|'Imagine that': an engaging opener that speaks to the reader.>> एक सुबह आप नल खोलें और उसमें से पानी की एक बूँद भी न आए। यह कोई कहानी नहीं, {{बल्कि}} दुनिया के कई शहरों की सच्चाई है।",en:"Imagine that one morning you turn on the tap and not a single drop of water comes out. This is not a story; it is the reality in many cities of the world."},
 {tag:"Causes",hi:"पृथ्वी पर पीने योग्य पानी बहुत सीमित है, {{फिर भी}} हम उसे लापरवाही से बर्बाद करते हैं। बढ़ती जनसंख्या, पेड़ों की कटाई और नदियों का प्रदूषण इस संकट के मुख्य कारण हैं। <<परिणामस्वरूप, भूजल का स्तर हर साल नीचे जा रहा है।|Formal connector plus topic vocabulary (भूजल, groundwater).>>",en:"Drinkable water on Earth is very limited, yet we waste it carelessly. A growing population, the cutting of trees and river pollution are the main causes of this crisis. As a result, the groundwater level is falling every year."},
 {tag:"Action",hi:"हम विद्यार्थी भी इस समस्या के समाधान में योगदान दे सकते हैं। {{उदाहरण के लिए}}, दाँत साफ़ करते समय नल बंद रखें, बोतल में बचा पानी पौधों में डालें और टपकते नलों की सूचना तुरंत दें। <<यदि हर विद्यार्थी रोज़ केवल दस लीटर पानी बचाए, तो|A hypothetical condition with the subjunctive बचाए: persuasive and complex.>> हमारा विद्यालय एक साल में लाखों लीटर पानी बचा सकता है।",en:"We students can also contribute to solving this problem. For example, keep the tap off while brushing your teeth, pour leftover bottle water on plants and report dripping taps at once. If every student saved just ten litres a day, our school could save millions of litres in a year."},
 {tag:"Close",hi:"याद रखिए, <<जल है तो कल है।|A well-known slogan: 'If there is water, there is a tomorrow'. A memorable close.>> आइए, आज से ही हर बूँद को सँभालें!",en:"Remember: no water, no tomorrow. Let us start looking after every drop today!"}],
 notes:["The opening asks the reader to imagine a scene, which builds interest fast.","Each bullet has its own paragraph; the action paragraph gives three concrete examples.","Vocabulary from the notes' word bank: समस्या, समाधान, योगदान, प्रदूषण.","A slogan and a call to action make a strong ending."]},

{id:"a-sport",type:"article",title:"Sport is study's partner, not its enemy",official:false,
 taskHi:"अपने स्कूल की पत्रिका के लिए ‘विद्यार्थी जीवन में खेलों का महत्व’ विषय पर लेख लिखिए।",
 taskEn:"Write an article for your school magazine on 'The importance of sport in student life'.",
 bullets:[["खेलों के लाभ","the benefits of sport"],["विद्यार्थी खेलों के लिए समय क्यों नहीं निकाल पाते","why students cannot find time for sport"],["आपके सुझाव","your suggestions"]],
 paras:[
 {tag:"Title",hi:"खेल: पढ़ाई का दुश्मन नहीं, साथी",en:"Sport: study's partner, not its enemy"},
 {tag:"Hook",hi:"अक्सर माता-पिता कहते हैं, “खेलना बंद करो और पढ़ाई करो!” {{लेकिन}} क्या खेल सचमुच पढ़ाई के दुश्मन हैं? <<मेरे विचार से इसका उत्तर 'नहीं' है।|States the writer's position early, which gives the article direction.>>",en:"Parents often say, 'Stop playing and study!' But is sport really the enemy of study? In my view, the answer is no."},
 {tag:"Benefits",hi:"खेलों से शरीर स्वस्थ और ऊर्जावान रहता है। {{इसके अतिरिक्त}}, खेल हमें अनुशासन, टीम भावना और हार को स्वीकार करना सिखाते हैं। <<जो विद्यार्थी नियमित व्यायाम करते हैं, उनकी एकाग्रता भी बेहतर होती है।|Relative-correlative जो ... उनकी, plus the notes' phrase नियमित व्यायाम.>>",en:"Sport keeps the body healthy and energetic. In addition, it teaches us discipline, team spirit and how to accept defeat. Students who exercise regularly also concentrate better."},
 {tag:"Problem",hi:"{{फिर भी}}, आजकल अधिकांश विद्यार्थी खेलों के लिए समय नहीं निकाल पाते। <<ट्यूशन, गृहकार्य और मोबाइल फ़ोन ने खेल के मैदानों को सूना कर दिया है।|Figurative language: 'have left the playgrounds deserted'.>>",en:"Even so, most students today cannot find time for sport. Tuition, homework and mobile phones have left the playgrounds deserted."},
 {tag:"Suggestions",hi:"इस स्थिति को बदलने के लिए विद्यालयों को हर दिन कम से कम एक खेल की घंटी अनिवार्य करनी चाहिए। माता-पिता को भी बच्चों को प्रोत्साहन देना चाहिए। आख़िरकार, <<स्वस्थ शरीर में ही स्वस्थ मन निवास करता है।|A well-known saying: 'a healthy mind lives in a healthy body'.>>",en:"To change this, schools should make at least one games period compulsory every day. Parents should also encourage their children. After all, a healthy mind lives in a healthy body."}],
 notes:["Opens with a familiar quotation and a question, then states a clear position.","Every bullet is covered and developed.","Word bank vocabulary: अनुशासन, अनिवार्य, प्रोत्साहन, ऊर्जावान.","Ends with a saying that sums up the argument."]},

/* ======== EXERCISE 6: ESSAYS ======== */
{id:"s-city",type:"essay",title:"City life or village life?",official:false,
 taskHi:"‘शहर का जीवन गाँव के जीवन से बेहतर है।’ इस कथन पर अपने विचार लिखते हुए अपने अध्यापक के लिए एक निबंध लिखिए।",
 taskEn:"Write an essay for your teacher on the statement 'Life in a city is better than life in a village.' Give your views.",
 bullets:[["शहर के जीवन के पक्ष में तर्क","arguments for city life"],["उसके विपक्ष में तर्क","arguments against"],["आपका निष्कर्ष","your conclusion"]],
 paras:[
 {tag:"Title",hi:"शहर या गाँव: कहाँ का जीवन बेहतर?",en:"City or village: where is life better?"},
 {tag:"Introduction",hi:"आजकल बहुत से लोग गाँव छोड़कर शहरों में बस रहे हैं। कुछ लोगों का मानना है कि शहर का जीवन गाँव से बेहतर है, {{जबकि}} कुछ इससे सहमत नहीं हैं।",en:"Nowadays many people are leaving villages and settling in cities. Some believe city life is better than village life, whereas others do not agree."},
 {tag:"For",hi:"{{एक ओर}}, शहरों में सुविधाएँ अधिक होती हैं। वहाँ अच्छे स्कूल, बड़े अस्पताल और नौकरी के अनेक अवसर मिलते हैं। {{इसके अतिरिक्त}}, यातायात के साधन भी आसानी से उपलब्ध होते हैं। {{इसी कारण}} युवा शहरों की ओर आकर्षित होते हैं।",en:"On one hand, cities have more facilities. There are good schools, big hospitals and many job opportunities. In addition, transport is easily available. For this reason young people are drawn to cities."},
 {tag:"Against",hi:"{{दूसरी ओर}}, शहरों में प्रदूषण और भीड़ बहुत है। <<लोग इतने व्यस्त रहते हैं कि वे अपने पड़ोसियों को भी नहीं जानते।|Result clause इतने ... कि.>> {{इसके विपरीत}}, गाँव की हवा साफ़ होती है और लोग एक-दूसरे की मदद करते हैं। {{हालाँकि}}, वहाँ शिक्षा और इलाज की कमी एक गंभीर समस्या है।",en:"On the other hand, cities have a lot of pollution and crowds. People are so busy that they do not even know their neighbours. In contrast, village air is clean and people help one another. However, the lack of education and medical care there is a serious problem."},
 {tag:"Conclusion",hi:"{{अंत में}}, मेरा मानना है कि दोनों जगहों के अपने लाभ और हानियाँ हैं। <<यदि गाँवों में भी अच्छी सुविधाएँ पहुँचाई जाएँ, तो|Passive conditional with the subjunctive पहुँचाई जाएँ.>> वहाँ का जीवन सबसे अच्छा हो सकता है।",en:"Finally, I believe both places have their own advantages and disadvantages. If good facilities also reach the villages, life there could be the best."}],
 notes:["Classic essay shape: introduction, one side, the other side, conclusion with the writer's own view.","Every opinion is supported by a reason or example, which is what 'well developed' means.","Formal words replace everyday ones: सुविधाएँ, अवसर, उपलब्ध, आकर्षित.","A wide range of linking words, including contrast (इसके विपरीत, हालाँकि) and condition (यदि ... तो)."]},

{id:"s-online",type:"essay",title:"Online learning or classroom learning?",official:false,
 taskHi:"‘ऑनलाइन पढ़ाई कक्षा की पढ़ाई से बेहतर है।’ इस कथन पर अपने विचार लिखते हुए निबंध लिखिए।",
 taskEn:"Write an essay on the statement 'Online learning is better than classroom learning.' Give your views.",
 bullets:[["ऑनलाइन पढ़ाई के लाभ","benefits of online learning"],["उसकी कमियाँ","its drawbacks"],["आपका निष्कर्ष","your conclusion"]],
 paras:[
 {tag:"Title",hi:"ऑनलाइन पढ़ाई या कक्षा की पढ़ाई?",en:"Online learning or classroom learning?"},
 {tag:"Introduction",hi:"<<महामारी के दौरान जब विद्यालय बंद हुए, तब|जब ... तब: a correlative time clause.>> ऑनलाइन पढ़ाई ने शिक्षा को रुकने नहीं दिया। आज भी कई लोग मानते हैं कि यह कक्षा की पढ़ाई से बेहतर है। <<इस निबंध में मैं दोनों पक्षों पर विचार करूँगा।|Signposts the essay's structure: shows organisation.>>",en:"When schools closed during the pandemic, online learning kept education going. Even today many people believe it is better than classroom learning. In this essay I will consider both sides."},
 {tag:"For",hi:"{{एक ओर}}, ऑनलाइन पढ़ाई के कई लाभ हैं। विद्यार्थी अपनी गति से सीख सकते हैं और किसी पाठ को बार-बार देख सकते हैं। {{इसके अतिरिक्त}}, आने-जाने का समय और पैसा दोनों बचते हैं। <<गाँवों में रहने वाले विद्यार्थियों को भी|Participial adjective रहने वाले: 'who live in'.>> बड़े शहरों के अच्छे शिक्षकों से पढ़ने का अवसर मिलता है।",en:"On one hand, online learning has many benefits. Students can learn at their own pace and watch a lesson again and again. In addition, both travel time and money are saved. Students who live in villages also get the chance to learn from good teachers in big cities."},
 {tag:"Against",hi:"{{दूसरी ओर}}, स्क्रीन के सामने घंटों बैठने से आँखों और स्वास्थ्य पर बुरा असर पड़ता है। <<कक्षा में जो अनुशासन और मित्रों के साथ सीखने का आनंद मिलता है, वह|Relative-correlative जो ... वह.>> ऑनलाइन संभव नहीं।",en:"On the other hand, sitting in front of a screen for hours harms the eyes and health. The discipline and the joy of learning with friends that the classroom gives are not possible online."},
 {tag:"Conclusion",hi:"मेरा मानना है कि ऑनलाइन पढ़ाई कक्षा का विकल्प नहीं, {{बल्कि}} उसकी सहायक है। {{यदि}} दोनों का संतुलित उपयोग किया जाए, {{तो}} शिक्षा अधिक प्रभावशाली बन सकती है।",en:"I believe online learning is not a replacement for the classroom but a support for it. If both are used in balance, education can become more effective."}],
 notes:["The introduction gives context, states the debate and signposts the essay.","Each side is developed with reasons and examples.","The conclusion gives a balanced, original view (a support, not a replacement).","Word bank vocabulary: अवसर, प्रभावशाली, विकल्प, संतुलित."]},

{id:"s-exams",type:"essay",title:"Are exams a fair test of ability?",official:false,
 taskHi:"‘परीक्षाएँ ही विद्यार्थी की योग्यता की सही कसौटी हैं।’ इस विषय पर अपने अध्यापक के लिए निबंध लिखिए।",
 taskEn:"Write an essay for your teacher on 'Exams are the true test of a student's ability.'",
 bullets:[["परीक्षाओं के लाभ","the benefits of exams"],["परीक्षाओं की सीमाएँ","the limits of exams"],["आपकी राय","your opinion"]],
 paras:[
 {tag:"Title",hi:"क्या परीक्षाएँ योग्यता की सही कसौटी हैं?",en:"Are exams a true test of ability?"},
 {tag:"Introduction",hi:"हमारी शिक्षा प्रणाली में परीक्षाओं को बहुत महत्व दिया जाता है। अधिकांश लोगों का मानना है कि अंक ही किसी विद्यार्थी की योग्यता का सबसे अच्छा प्रमाण हैं, <<किंतु यह विषय विवादास्पद है।|Formal register: किंतु and विवादास्पद (controversial).>>",en:"Our education system gives great importance to exams. Most people believe marks are the best proof of a student's ability, but this subject is controversial."},
 {tag:"For",hi:"इसमें कोई संदेह नहीं कि परीक्षाओं के कुछ लाभ हैं। ये विद्यार्थियों को नियमित पढ़ाई के लिए प्रेरित करती हैं। {{साथ ही}}, <<सभी के लिए एक समान मापदंड होने के कारण|के कारण with a verbal noun: 'because there is one standard for all'.>> इनसे निष्पक्ष तुलना संभव होती है।",en:"There is no doubt that exams have some benefits. They motivate students to study regularly. Also, because there is one standard for everyone, they make fair comparison possible."},
 {tag:"Against",hi:"{{इसके विपरीत}}, तीन घंटे की परीक्षा किसी की पूरी प्रतिभा नहीं माप सकती। <<कई विद्यार्थी, जो कक्षा में अत्यंत रचनात्मक होते हैं, परीक्षा के तनाव में|An embedded relative clause (जो ...) inside the main sentence.>> अपना सर्वश्रेष्ठ प्रदर्शन नहीं कर पाते। {{इसके अतिरिक्त}}, परीक्षाएँ अक्सर रटने को बढ़ावा देती हैं, समझ को नहीं।",en:"In contrast, a three-hour exam cannot measure someone's full talent. Many students who are very creative in class cannot give their best under exam stress. In addition, exams often encourage learning by rote, not understanding."},
 {tag:"Conclusion",hi:"<<अतः|Formal 'therefore'.>> मेरे विचार से परीक्षाएँ आवश्यक हैं, {{परंतु}} उन्हें ही एकमात्र कसौटी मानना उचित नहीं। परियोजना-कार्य, प्रस्तुतियाँ और व्यावहारिक कौशल भी मूल्यांकन का हिस्सा होने चाहिए।",en:"Therefore, in my view exams are necessary, but treating them as the only test is not right. Project work, presentations and practical skills should also be part of assessment."}],
 notes:["A high-level formal register: किंतु, परंतु, अतः, विवादास्पद, मूल्यांकन.","The embedded relative clause is a clear example of a complex structure.","The conclusion goes beyond yes or no and suggests an alternative.","Word bank vocabulary: रचनात्मक, आवश्यक, अवसर, प्रशंसा-type evaluative words."]},

{id:"s-coed",type:"essay",title:"Co-education: advantages and disadvantages",official:false,
 source:"Topic from the November 2024 paper (previous syllabus)",
 taskHi:"सह-शिक्षा (लड़के और लड़कियों का साथ पढ़ना) के लाभ और हानियों पर अपने विचार लिखते हुए एक निबंध लिखिए।",
 taskEn:"Write an essay on the advantages and disadvantages of co-education (boys and girls studying together).",
 bullets:[["सह-शिक्षा के लाभ","advantages of co-education"],["सह-शिक्षा की हानियाँ","disadvantages of co-education"],["आपका निष्कर्ष","your conclusion"]],
 paras:[
 {tag:"Title",hi:"सह-शिक्षा: लाभ और हानियाँ",en:"Co-education: advantages and disadvantages"},
 {tag:"Introduction",hi:"सह-शिक्षा का अर्थ है लड़कों और लड़कियों का एक ही विद्यालय और कक्षा में साथ पढ़ना। <<आज अधिकांश विद्यालयों में यही व्यवस्था है, फिर भी इसके लाभ-हानि पर मतभेद बना हुआ है।|Concession with फिर भी and the formal word मतभेद (difference of opinion).>>",en:"Co-education means boys and girls studying together in the same school and class. Most schools follow this system today, yet opinions on its pros and cons still differ."},
 {tag:"For",hi:"{{एक ओर}}, सह-शिक्षा से लड़के और लड़कियाँ एक-दूसरे का सम्मान करना सीखते हैं। <<साथ पढ़ने वाले विद्यार्थी आगे चलकर|Participial adjective (पढ़ने वाले) and the phrase आगे चलकर, 'later in life'.>> कार्यस्थल पर भी सहज रूप से मिलकर काम कर पाते हैं। {{इसके अतिरिक्त}}, अलग-अलग विद्यालय बनाने की तुलना में यह व्यवस्था कम ख़र्चीली है।",en:"On one hand, co-education teaches boys and girls to respect each other. Students who study together are later able to work together naturally in the workplace. In addition, this system is less expensive than building separate schools."},
 {tag:"Against",hi:"{{दूसरी ओर}}, कुछ लोगों का मानना है कि किशोरावस्था में विद्यार्थियों का ध्यान पढ़ाई से भटक सकता है। {{साथ ही}}, कुछ संकोची विद्यार्थी मिश्रित कक्षा में प्रश्न पूछने या खेलों में भाग लेने से झिझकते हैं।",en:"On the other hand, some people believe that in adolescence students' attention can stray from their studies. Also, some shy students hesitate to ask questions or join in sports in a mixed class."},
 {tag:"Conclusion",hi:"<<सभी पहलुओं पर विचार करने के बाद|'Having considered all aspects': a mature way to begin a conclusion.>> मेरा मानना है कि सह-शिक्षा के लाभ उसकी हानियों से कहीं अधिक हैं। {{यदि}} विद्यालय अनुशासन और आपसी सम्मान का वातावरण बनाएँ, {{तो}} यह व्यवस्था समाज के लिए अत्यंत लाभदायक सिद्ध होगी।",en:"Having considered all aspects, I believe the advantages of co-education far outweigh its disadvantages. If schools create an atmosphere of discipline and mutual respect, this system will prove extremely beneficial for society."}],
 notes:["It stays on the question. The November 2024 examiner report says weaker answers to this topic drifted into gender discrimination, exam pressure and home schooling, and lost content marks.","Starts by defining the term, which shows clear understanding of the task.","Balanced: two developed points on each side before a reasoned conclusion.","Formal vocabulary: मतभेद, किशोरावस्था, संकोची, कार्यस्थल, लाभदायक."]},

/* ======== EXERCISE 6: REVIEWS ======== */
{id:"v-museum",type:"review",title:"The town's new science museum",official:false,
 taskHi:"आप हाल ही में अपने शहर की किसी नई जगह पर गए। अपनी स्कूल पत्रिका के लिए उसकी समीक्षा लिखिए।",
 taskEn:"You recently visited a new place in your town. Write a review of it for your school magazine.",
 bullets:[["आप कहाँ गए और वहाँ क्या है","where you went and what is there"],["आपको क्या अच्छा लगा और क्या नहीं","what you liked and did not like"],["क्या आप दूसरों को वहाँ जाने की सलाह देंगे","whether you recommend it"]],
 paras:[
 {tag:"Title",hi:"समीक्षा: शहर का नया विज्ञान संग्रहालय",en:"Review: the town's new science museum"},
 {tag:"What and where",hi:"पिछले शनिवार मैं अपने परिवार के साथ शहर के नए विज्ञान संग्रहालय गया। यह रेलवे स्टेशन के पास स्थित है और पिछले महीने ही खुला है।",en:"Last Saturday I went with my family to the town's new science museum. It is located near the railway station and opened only last month."},
 {tag:"Good points",hi:"संग्रहालय तीन मंज़िलों में फैला है। पहली मंज़िल पर अंतरिक्ष से जुड़ी प्रदर्शनी है। मुझे सबसे अधिक दूसरी मंज़िल पसंद आई, {{क्योंकि}} <<वहाँ दर्शक स्वयं प्रयोग कर सकते हैं।|Precise topic vocabulary: दर्शक, स्वयं, प्रयोग.>> {{उदाहरण के लिए}}, मैंने साइकिल चलाकर बिजली बनाई! कर्मचारी भी विनम्र थे और हर चीज़ सरल भाषा में समझा रहे थे।",en:"The museum is spread over three floors. The first floor has an exhibition about space. I liked the second floor most, because visitors can do experiments themselves. For example, I made electricity by pedalling a bicycle! The staff were polite too and explained everything in simple language."},
 {tag:"Weak points",hi:"{{हालाँकि}}, कुछ कमियाँ भी दिखीं। टिकट का मूल्य विद्यार्थियों के लिए थोड़ा अधिक है। {{इसके अलावा}}, कैंटीन छोटी है, {{इसलिए}} दोपहर में वहाँ लंबी कतार लग जाती है।",en:"However, there were some weaknesses too. The ticket price is a little high for students. Besides, the canteen is small, so there is a long queue there at lunchtime."},
 {tag:"Verdict",hi:"{{कुल मिलाकर}}, <<यह संग्रहालय ज्ञान और मनोरंजन का अच्छा मेल है।|A neat summarising phrase: 'a good mix of knowledge and entertainment'.>> मैं इसे पाँच में से चार अंक दूँगा। {{यदि}} आपको विज्ञान में रुचि है, {{तो}} आपको यहाँ अवश्य जाना चाहिए।",en:"Overall, this museum is a good mix of knowledge and entertainment. I would give it four out of five. If you are interested in science, you should definitely go."}],
 notes:["A review describes and judges. This one gives facts first, then good points, weak points and a verdict.","Mentioning a weakness makes the review balanced and believable.","A rating and a clear recommendation tell the reader what to do.","Topic vocabulary: संग्रहालय, प्रदर्शनी, प्रयोग, कर्मचारी, मूल्य."]},

{id:"v-book",type:"review",title:"Premchand's story 'Idgah'",official:false,
 taskHi:"आपने हाल ही में जो कहानी या पुस्तक पढ़ी है, उसकी समीक्षा अपने स्कूल की पत्रिका के लिए लिखिए।",
 taskEn:"Write a review of a story or book you read recently for your school magazine.",
 bullets:[["कहानी किस बारे में है","what the story is about"],["आपको क्या अच्छा लगा और क्या नहीं","what you liked and did not like"],["किसे यह पढ़नी चाहिए","who should read it"]],
 paras:[
 {tag:"Title",hi:"समीक्षा: प्रेमचंद की कहानी ‘ईदगाह’",en:"Review: Premchand's story 'Idgah'"},
 {tag:"Introduction",hi:"हाल ही में मैंने हिंदी की कक्षा में मुंशी प्रेमचंद की प्रसिद्ध कहानी ‘ईदगाह’ पढ़ी। <<यह कहानी लगभग सौ साल पुरानी है, फिर भी आज के पाठकों के दिल को छू जाती है।|Concession with फिर भी and the idiom दिल को छू जाना.>>",en:"Recently in Hindi class I read Munshi Premchand's famous story 'Idgah'. The story is almost a hundred years old, yet it still touches today's readers."},
 {tag:"The story",hi:"कहानी का नायक हामिद एक ग़रीब, अनाथ बच्चा है, जो अपनी दादी अमीना के साथ रहता है। ईद के मेले में उसके दोस्त खिलौने और मिठाइयाँ ख़रीदते हैं, {{जबकि}} हामिद अपने तीन पैसों से दादी के लिए एक चिमटा ख़रीदता है, {{ताकि}} रोटियाँ सेंकते समय उनकी उँगलियाँ न जलें।",en:"The hero, Hamid, is a poor orphan who lives with his grandmother Amina. At the Eid fair his friends buy toys and sweets, while Hamid spends his three paise on a pair of tongs for his grandmother, so that her fingers do not burn while she cooks rotis."},
 {tag:"Good and weak",hi:"मुझे कहानी की सबसे अच्छी बात इसकी सरल भाषा और भावुक अंत लगा। <<जब दादी चिमटा देखकर रो पड़ती हैं, तब पाठक की आँखें भी नम हो जाती हैं।|जब ... तब with the idiom आँखें नम होना.>> {{हालाँकि}}, कुछ पुराने उर्दू शब्द आज के विद्यार्थियों को कठिन लग सकते हैं।",en:"What I liked most was its simple language and emotional ending. When the grandmother cries on seeing the tongs, the reader's eyes fill with tears too. However, some old Urdu words may seem difficult to students today."},
 {tag:"Verdict",hi:"{{कुल मिलाकर}}, <<यह कहानी त्याग और प्रेम का सुंदर संदेश देती है।|Abstract nouns त्याग (sacrifice) and प्रेम give the verdict depth.>> मैं इसे पाँच में से पाँच अंक दूँगी और हर विद्यार्थी को इसे पढ़ने की सलाह दूँगी।",en:"Overall, the story gives a beautiful message of sacrifice and love. I would give it five out of five and advise every student to read it."}],
 notes:["The summary is short. A review should not retell the whole story.","It gives an honest weakness (old Urdu words) even for a story the writer loves.","Two idioms (दिल को छू जाना, आँखें नम होना) show range.","The verdict names the theme and recommends a reader."]},

{id:"v-film",type:"review",title:"The film 'Taare Zameen Par'",official:false,
 taskHi:"आपने हाल ही में देखी किसी फ़िल्म की समीक्षा अपने स्कूल की पत्रिका के लिए लिखिए।",
 taskEn:"Write a review of a film you watched recently for your school magazine.",
 bullets:[["फ़िल्म की कहानी","the film's story"],["अभिनय, संगीत और अन्य बातें","acting, music and other features"],["आपकी राय और सलाह","your opinion and recommendation"]],
 paras:[
 {tag:"Title",hi:"समीक्षा: ‘तारे ज़मीन पर’",en:"Review: 'Taare Zameen Par'"},
 {tag:"Introduction",hi:"पिछले सप्ताहांत मैंने अपने परिवार के साथ आमिर ख़ान की फ़िल्म ‘तारे ज़मीन पर’ देखी। <<यह फ़िल्म भले ही 2007 में बनी थी, लेकिन इसका संदेश आज भी उतना ही प्रासंगिक है।|Concession with भले ही ... लेकिन, and the precise word प्रासंगिक (relevant).>>",en:"Last weekend I watched Aamir Khan's film 'Taare Zameen Par' with my family. Even though it was made in 2007, its message is just as relevant today."},
 {tag:"The story",hi:"फ़िल्म की कहानी आठ साल के ईशान के बारे में है, जिसे पढ़ने-लिखने में कठिनाई होती है। सब उसे आलसी समझते हैं, {{यहाँ तक कि}} उसके माता-पिता उसे बोर्डिंग स्कूल भेज देते हैं। वहाँ कला शिक्षक राम शंकर निकुंभ समझ जाते हैं कि ईशान को डिस्लेक्सिया है।",en:"The film is about eight-year-old Ishaan, who finds reading and writing difficult. Everyone thinks he is lazy; his parents even send him to boarding school. There, the art teacher Ram Shankar Nikumbh realises that Ishaan has dyslexia."},
 {tag:"Good and weak",hi:"<<दर्शील सफ़ारी ने ईशान की भूमिका इतनी स्वाभाविकता से निभाई है कि|Result clause इतनी ... कि.>> कई दृश्यों में मेरी आँखें भर आईं। फ़िल्म का संगीत भी कहानी के भावों को गहराई देता है। {{दूसरी ओर}}, फ़िल्म थोड़ी लंबी है और बीच का हिस्सा धीमा लगता है।",en:"Darsheel Safary plays Ishaan so naturally that my eyes filled with tears in several scenes. The music also deepens the story's emotions. On the other hand, the film is a little long and the middle part feels slow."},
 {tag:"Verdict",hi:"{{कुल मिलाकर}}, यह फ़िल्म हर माता-पिता और शिक्षक को देखनी चाहिए, {{क्योंकि}} <<यह सिखाती है कि हर बच्चा विशेष होता है।|Ends on the film's message, which shows understanding beyond the plot.>>",en:"Overall, every parent and teacher should watch this film, because it teaches that every child is special."}],
 notes:["Covers story, acting, music and a weakness: everything a reader needs to decide.","भले ही ... लेकिन and इतनी ... कि are two complex structures in one short piece.","The verdict names a target audience and the film's message.","Formal vocabulary: प्रासंगिक, स्वाभाविकता, भावों को गहराई देना."]},

{id:"v-restaurant",type:"review",title:"A new vegetarian restaurant",official:false,
 taskHi:"आप हाल ही में अपने शहर में खुले एक नए भोजनालय में गईं। अपनी स्कूल पत्रिका के लिए उसकी समीक्षा लिखिए।",
 taskEn:"You recently went to a new restaurant in your town. Write a review of it for your school magazine.",
 bullets:[["भोजनालय और उसका वातावरण","the restaurant and its atmosphere"],["भोजन और सेवा","the food and the service"],["कमियाँ और आपकी सलाह","weaknesses and your advice"]],
 paras:[
 {tag:"Title",hi:"समीक्षा: ‘स्वाद घर’ भोजनालय",en:"Review: 'Swaad Ghar' restaurant"},
 {tag:"Introduction",hi:"पिछले रविवार मैं अपने परिवार के साथ गांधी मार्ग पर खुले नए शाकाहारी भोजनालय ‘स्वाद घर’ गई, जहाँ हमने दोपहर का भोजन किया।",en:"Last Sunday I went with my family to Swaad Ghar, the new vegetarian restaurant on Gandhi Marg, where we had lunch."},
 {tag:"Good points",hi:"भोजनालय का वातावरण बहुत आकर्षक है; दीवारों पर राजस्थानी चित्रकला सजी है और हल्का लोक-संगीत बजता रहता है। <<हमने जो दाल-बाटी चूरमा मँगवाया, वह इतना स्वादिष्ट था कि|Two complex structures in one sentence: जो ... वह and इतना ... कि.>> हमने उसे दोबारा मँगवाया। {{इसके अलावा}}, यहाँ के कर्मचारी विनम्र और फुर्तीले थे।",en:"The atmosphere is very attractive: the walls are decorated with Rajasthani paintings and soft folk music plays. The dal-baati churma we ordered was so delicious that we ordered it again. Besides, the staff were polite and quick."},
 {tag:"Weak points",hi:"{{परंतु}} कुछ कमियाँ भी थीं। सप्ताहांत पर भीड़ अधिक होने के कारण हमें मेज़ के लिए आधा घंटा प्रतीक्षा करनी पड़ी। {{साथ ही}}, मिठाइयों के दाम थोड़े ज़्यादा हैं।",en:"But there were some weaknesses. Because of the weekend crowd, we had to wait half an hour for a table. Also, the desserts are a little expensive."},
 {tag:"Verdict",hi:"{{कुल मिलाकर}}, स्वाद और वातावरण दोनों की दृष्टि से यह भोजनालय उत्तम है। मैं इसे पाँच में से चार अंक दूँगी। <<मेरी सलाह है कि आप पहले से मेज़ आरक्षित करवा लें।|Formal recommendation with a subjunctive verb (करवा लें).>>",en:"Overall, in terms of both taste and atmosphere, this restaurant is excellent. I would give it four out of five. My advice is to book a table in advance."}],
 notes:["Practical advice in the verdict (book in advance) comes straight from the weakness mentioned earlier. That is good organisation.","Sensory details (paintings, folk music, a named dish) develop the content.","Formal words: वातावरण, आकर्षक, आरक्षित, उत्तम, की दृष्टि से.","Feminine agreement is consistent for a female writer: गई, दूँगी."]}
];

 tips:["Stay formal. Do not address the reader.","Use contrast words to move between the two sides: एक ओर, दूसरी ओर, हालाँकि, इसके विपरीत.","Stay on the exact question. Drifting into a related topic loses content marks.","Do not add new arguments in the conclusion."]},

{"id":"e-competition","type":"email","title":"I won the debate competition","official":false,"source":"Uses the School and achievements theme from the class notes","taskHi":"आपने हाल ही में एक प्रतियोगिता जीती है। अपने मित्र को इसके बारे में ईमेल लिखिए।","taskEn":"You recently won a competition. Write an email to your friend about it.","bullets":[["प्रतियोगिता क्या थी","what the competition was"],["आपने तैयारी कैसे की","how you prepared"],["जीतने पर आपको कैसा लगा","how you felt when you won"]],"paras":[{"tag":"Subject","hi":"विषय: एक ख़ुशख़बरी!","en":"Subject: Some good news!"},{"tag":"Greeting","hi":"प्रिय करण,\nनमस्ते! आशा है तुम ठीक होगे। आज मैं तुम्हें एक बड़ी ख़ुशख़बरी देना चाहता हूँ: मैंने ज़िला स्तर की वाद-विवाद प्रतियोगिता में <<प्रथम स्थान|'First place': formal vocabulary from the notes.>> प्राप्त किया है!","en":"Dear Karan,\nHello! I hope you are well. Today I want to give you some big news: I have won first place in the district debate competition!"},{"tag":"Point 1","hi":"यह प्रतियोगिता पिछले शनिवार नगर भवन में हुई थी, जिसमें बीस विद्यालयों के विद्यार्थियों ने भाग लिया। विषय था, ‘क्या तकनीक ने हमें अकेला बना दिया है?’ मुझे इसके पक्ष में बोलना था।","en":"The competition was held last Saturday at the town hall, and students from twenty schools took part. The topic was 'Has technology made us lonely?' I had to speak for the motion."},{"tag":"Point 2","hi":"तैयारी के लिए मैंने दो हफ़्ते तक रोज़ अख़बार पढ़े और ज़रूरी आँकड़े इकट्ठे किए। {{इसके अतिरिक्त}}, <<मैं हर शाम आईने के सामने खड़े होकर अभ्यास करता था|Habitual past (करता था) plus the participle खड़े होकर.>>, {{ताकि}} मंच पर घबराहट न हो।","en":"To prepare, I read the newspaper every day for two weeks and collected important figures. In addition, every evening I practised standing in front of the mirror, so that I would not get nervous on stage."},{"tag":"Point 3","hi":"जब परिणाम घोषित हुआ, तो <<मेरी ख़ुशी का ठिकाना न रहा।|Idiom: 'my joy knew no bounds'.>> <<आख़िरकार मेरी मेहनत रंग लाई!|Idiom from the notes: 'my hard work paid off'.>> पुरस्कार में मुझे एक ट्रॉफ़ी और कुछ पुस्तकें मिलीं।","en":"When the result was announced, my joy knew no bounds. At last my hard work had paid off! As a prize I got a trophy and some books."},{"tag":"Closing","hi":"अपनी ख़बर भी देना।\nतुम्हारा दोस्त,\nअर्जुन","en":"Send me your news too.\nYour friend,\nArjun"}],"notes":["Two idioms in one paragraph show range, but each fits the meaning exactly.","Past tenses are varied: simple past, past perfect (हुई थी) and habitual past (करता था).","The preparation paragraph gives two methods and a purpose clause (ताकि).","Theme vocabulary from the notes: प्रतियोगिता, प्रथम स्थान, पुरस्कार, मेहनत रंग लाना."]},
{"id":"r-sports","type":"report","title":"The annual sports day","official":false,"taskHi":"अपने विद्यालय के खेल दिवस पर विद्यालय की पत्रिका के लिए रिपोर्ट लिखिए।","taskEn":"Write a report on your school's sports day for the school magazine.","bullets":[["कौन-कौन सी प्रतियोगिताएँ हुईं","which events took place"],["सबसे यादगार क्षण","the most memorable moment"],["अगले वर्ष के लिए सुझाव","suggestions for next year"]],"paras":[{"tag":"Title","hi":"वार्षिक खेल दिवस: एक रिपोर्ट","en":"Annual sports day: a report"},{"tag":"Introduction","hi":"पिछले शुक्रवार हमारे विद्यालय के मैदान में वार्षिक खेल दिवस बड़े उत्साह के साथ मनाया गया। इस रिपोर्ट में दिन की मुख्य प्रतियोगिताओं और अनुभवों का विवरण दिया गया है।","en":"Last Friday the annual sports day was celebrated with great enthusiasm on our school ground. This report describes the main events and experiences of the day."},{"tag":"Events","hi":"कार्यक्रम का आरंभ सुबह आठ बजे मशाल जुलूस से हुआ। {{इसके बाद}} सौ मीटर दौड़, रिले दौड़, लंबी कूद और रस्साकशी जैसी प्रतियोगिताएँ <<आयोजित की गईं।|Feminine plural passive, agreeing with प्रतियोगिताएँ.>> चारों सदनों के लगभग चार सौ विद्यार्थियों ने भाग लिया और अंत में नीला सदन विजेता घोषित हुआ।","en":"The programme began at eight with a torch procession. After this, events such as the 100-metre race, relay, long jump and tug of war were held. About four hundred students from all four houses took part, and in the end Blue House was declared the winner."},{"tag":"Highlight","hi":"<<दिन का सबसे यादगार क्षण तब आया, जब|तब ... जब correlative clause.>> रिले दौड़ में पीछे चल रही लाल सदन की टीम ने अंतिम चक्कर में सबको पीछे छोड़ दिया। दर्शकों ने खड़े होकर तालियाँ बजाईं।","en":"The most memorable moment came when Red House's team, which was trailing in the relay, overtook everyone on the final lap. The audience stood and clapped."},{"tag":"Suggestions","hi":"{{हालाँकि}}, दोपहर की तेज़ धूप के कारण कई खिलाड़ी थक गए थे। {{अतः}} सुझाव है कि <<अगले वर्ष प्रतियोगिताएँ सुबह जल्दी शुरू की जाएँ|Passive subjunctive: the most formal way to recommend.>> और मैदान के पास पीने के पानी की अधिक व्यवस्था हो।","en":"However, many athletes were tired because of the strong afternoon sun. So it is suggested that next year the events start early in the morning and that more drinking water is provided near the ground."},{"tag":"Conclusion","hi":"कुल मिलाकर, यह दिन खेल-भावना और टीम-भावना का सुंदर उदाहरण रहा।","en":"Overall, the day was a fine example of sportsmanship and team spirit."}],"notes":["Clear report structure: title, purpose, facts, highlight, problem with suggestion, conclusion.","Numbers and names make the facts precise (चार सौ विद्यार्थी, नीला सदन).","The passive is used correctly with plural and feminine agreement (आयोजित की गईं, शुरू की जाएँ).","The suggestion grows directly out of a problem the report noticed."]},
{"id":"a-stress","type":"article","title":"Exam stress: break the silence","official":false,"source":"Uses the Health theme from the class notes","taskHi":"आपकी स्कूल पत्रिका ‘विद्यार्थी और परीक्षा का तनाव’ विषय पर लेख आमंत्रित कर रही है। एक लेख लिखिए।","taskEn":"Your school magazine is inviting articles on 'Students and exam stress'. Write an article.","bullets":[["तनाव के कारण","the causes of stress"],["इसके प्रभाव","its effects"],["तनाव कम करने के उपाय","ways to reduce stress"]],"paras":[{"tag":"Title","hi":"परीक्षा का तनाव: चुप्पी तोड़ें","en":"Exam stress: break the silence"},{"tag":"Hook","hi":"<<क्या परीक्षा से पहले आपकी भी नींद उड़ जाती है?|Idiom नींद उड़ना ('to lose sleep') in an opening question.>> यदि हाँ, तो जान लीजिए कि यह अनुभव लगभग हर विद्यार्थी का है।","en":"Do you also lose sleep before exams? If so, know that almost every student has the same experience."},{"tag":"Causes","hi":"आजकल विद्यार्थियों पर अच्छे अंक लाने का भारी दबाव है। माता-पिता की अपेक्षाएँ, कड़ी प्रतिस्पर्धा और सोशल मीडिया पर दूसरों से तुलना इस तनाव को और बढ़ा देते हैं।","en":"Today students are under heavy pressure to get good marks. Parents' expectations, fierce competition and comparing yourself with others on social media make the stress even worse."},{"tag":"Effects","hi":"<<परिणामस्वरूप, कई विद्यार्थी सिरदर्द, चिड़चिड़ेपन और अनिद्रा का शिकार हो जाते हैं।|Formal connector and precise vocabulary (अनिद्रा, insomnia).>> कुछ तो इतने घबरा जाते हैं कि जो पढ़ा था, वह भी भूल जाते हैं।","en":"As a result, many students suffer from headaches, irritability and insomnia. Some panic so much that they forget even what they had studied."},{"tag":"Solutions","hi":"तनाव से बचने के कई सरल उपाय हैं। {{उदाहरण के लिए}}, पढ़ाई के बीच छोटे विराम लें, नियमित व्यायाम करें और पर्याप्त नींद लें। <<सबसे महत्वपूर्ण बात यह है कि अपनी परेशानी मन में दबाने के बजाय किसी भरोसेमंद व्यक्ति से बात करें।|के बजाय ('instead of') with a यह है कि clause for emphasis.>>","en":"There are many simple ways to avoid stress. For example, take short breaks while studying, exercise regularly and sleep enough. Most importantly, instead of bottling up your worries, talk to someone you trust."},{"tag":"Close","hi":"याद रखिए, अंक जीवन का केवल एक हिस्सा हैं, पूरा जीवन नहीं। <<मानसिक स्वास्थ्य|Theme vocabulary from the notes.>> का ध्यान रखना भी उतना ही ज़रूरी है जितना पढ़ाई करना।","en":"Remember, marks are only part of life, not the whole of it. Looking after your mental health is just as important as studying."}],"notes":["Opens with a question and reassurance, which builds a bond with readers.","Causes, effects and solutions each have their own paragraph.","Two result structures: परिणामस्वरूप and इतने ... कि.","Ends with a balanced message using उतना ही ... जितना."]},
{"id":"s-social","type":"essay","title":"Social media: blessing or curse?","official":false,"taskHi":"‘सोशल मीडिया किशोरों के लिए लाभ से अधिक हानि करता है।’ इस कथन पर निबंध लिखिए।","taskEn":"Write an essay on the statement 'Social media does teenagers more harm than good.'","bullets":[["सोशल मीडिया के लाभ","benefits of social media"],["उसकी हानियाँ","its harms"],["आपकी राय","your opinion"]],"paras":[{"tag":"Title","hi":"सोशल मीडिया: वरदान या अभिशाप?","en":"Social media: blessing or curse?"},{"tag":"Introduction","hi":"<<आज शायद ही कोई किशोर हो जो सोशल मीडिया का उपयोग न करता हो।|'There is hardly a teenager who does not use it': an advanced negative relative structure.>> कुछ लोग इसे वरदान मानते हैं, तो कुछ अभिशाप।","en":"Today there is hardly a teenager who does not use social media. Some see it as a blessing, others as a curse."},{"tag":"For","hi":"{{एक ओर}}, सोशल मीडिया ने दुनिया को एक-दूसरे के निकट ला दिया है। इसके द्वारा किशोर दूर रहने वाले मित्रों से जुड़े रहते हैं और नई जानकारी तुरंत प्राप्त करते हैं। {{इसके अतिरिक्त}}, कई युवा इसके माध्यम से अपनी रचनात्मक प्रतिभा लोगों तक पहुँचाते हैं।","en":"On one hand, social media has brought the world closer together. Through it, teenagers stay in touch with distant friends and get new information instantly. In addition, many young people use it to share their creative talent."},{"tag":"Against","hi":"{{दूसरी ओर}}, इसकी लत अत्यंत हानिकारक है। <<घंटों स्क्रीन पर बिताने के कारण|के कारण with a verbal noun.>> पढ़ाई और नींद दोनों प्रभावित होती हैं। {{साथ ही}}, दूसरों के आदर्श दिखने वाले जीवन से अपनी तुलना करने पर आत्मविश्वास घटता है।","en":"On the other hand, addiction to it is extremely harmful. Spending hours on screens affects both studies and sleep. Also, comparing yourself with others' seemingly perfect lives lowers self-confidence."},{"tag":"Conclusion","hi":"<<सभी पहलुओं पर विचार करने के बाद|A mature opener for a conclusion.>> मेरा मानना है कि सोशल मीडिया अपने आप में बुरा नहीं, {{बल्कि}} उसका असीमित उपयोग हानिकारक है। {{अतः}} किशोरों को इसके उपयोग की समय-सीमा स्वयं तय करनी चाहिए।","en":"Having considered all aspects, I believe social media is not bad in itself; rather, unlimited use of it is harmful. So teenagers should set their own time limits for using it."}],"notes":["The title frames the debate in four words (वरदान या अभिशाप).","Both sides are developed with two points each before the conclusion.","The conclusion answers the statement directly and adds a practical step.","Formal vocabulary: निकट, माध्यम, प्रतिभा, असीमित, समय-सीमा."]},

{s:"यह राम ___ किताब है।",o:["कि","की"],a:"की",why:"की means 'of' before a feminine noun (किताब)."},
{s:"___ कल दिल्ली जा रहा हूँ।",o:["में","मैं"],a:"मैं",why:"मैं means 'I'. में means 'in'. The extra matra changes the meaning completely."},
{s:"किताब बैग ___ है।",o:["में","मैं"],a:"में",why:"में means 'in / inside'."},
{s:"राम ___ श्याम नदी की ओर गए।",o:["और","ओर"],a:"और",why:"और (au) means 'and'. ओर (o) means 'direction, towards'."},
{s:"हम नदी की ___ चल पड़े।",o:["और","ओर"],a:"ओर",why:"ओर means 'towards'. की ओर = 'in the direction of'."},
{s:"आज का ___ बहुत अच्छा था।",o:["दिन","दीन"],a:"दिन",why:"दिन (short i) means 'day'. दीन (long ee) means 'poor, miserable'."},

{s:"मैं ठीक ___।",o:["हूँ","हू"],a:"हूँ",why:"हूँ ('am') always has a long ऊ and a chandrabindu."},

var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(s,bare){
  var t=esc(s);
  if(bare) return t.replace(/\[\[(.+?)\|(.+?)\]\]/g,"$1").replace(/&lt;&lt;(.+?)\|(.+?)&gt;&gt;/g,"$1").replace(/\{\{(.+?)\}\}/g,"$1");
  return t.replace(/\[\[(.+?)\|(.+?)\]\]/g,function(m,w,g){return '<button type="button" class="w" data-m="'+g+'">'+w+'</button>'})
          .replace(/&lt;&lt;(.+?)\|(.+?)&gt;&gt;/g,function(m,w,g){return '<button type="button" class="cx" data-m="'+g+'" data-k="Why it scores">'+w+'</button>'})
          .replace(/\{\{(.+?)\}\}/g,'<mark class="lk">$1</mark>');
}
function plain(s){return String(s).replace(/\[\[(.+?)\|.+?\]\]/g,"$1").replace(/<<(.+?)\|.+?>>/g,"$1").replace(/\{\{(.+?)\}\}/g,"$1")}
function countWords(s){return String(s).split(/\s+/).filter(function(t){return /[ऀ-ॣ०-ॿA-Za-z0-9]/.test(t)}).length}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

(function(){
  function done(){AI.ready=true;aiWaiters.splice(0).forEach(function(f){try{f()}catch(e){}});refreshAI()}
  if(!window.claude||!window.claude.use){done();return}

  $$("[data-needs-ai]").forEach(function(el){el.hidden=!AI.sample});

var ttsState="idle";
function listen(texts){
  if(!AI.tts)return;
  if(ttsState!=="idle"){AI.tts.stop().catch(function(){});return}
  var lines=[];texts.forEach(function(t){t=plain(t).replace(/\s+/g," ").trim();while(t.length>1900){var cut=t.lastIndexOf("।",1900);if(cut<200)cut=1900;lines.push(t.slice(0,cut+1));t=t.slice(cut+1).trim()}if(t)lines.push(t)});
  var opt={rate:0.9};if(AI.ttsLang)opt.language="hi";
  AI.tts.speak(lines.slice(0,100).map(function(t){return {text:t}}),opt).catch(function(e){if(e&&(e.code==="not_granted"||e.code==="unavailable")){AI.tts=null;refreshAI()}});
}
