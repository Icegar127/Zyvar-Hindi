function validSet(n,s){
  if(!s||typeof s!=="object"||!s.title||!Array.isArray(s.qs))return false;
  if(n===2){if(!Array.isArray(s.texts)||s.texts.length<3)return false;return s.qs.length>=6&&s.qs.every(function(q){return q.q&&/^[ABCD]$/.test(q.a)})}
  if(!Array.isArray(s.paras)||!s.paras.length)return false;
  if(n===4)return s.qs.length>=4&&s.qs.every(function(q){return q.q&&Array.isArray(q.o)&&q.o.length===3&&/^[ABC]$/.test(q.a)});
  return s.qs.every(function(q){return q.q&&Array.isArray(q.ans)&&q.ans.length})&&s.qs.length>=2;
}

"1-2: Task is only partially fulfilled. Content is only partially relevant. Style for the text type is inconsistent or inappropriate. Insufficient sense of purpose and audience. Limited attempt to develop content. Response is under-length.\n"+
"0: No creditable content.\n\n"+
"LANGUAGE (0-9): range (vocabulary, sentence structure), accuracy (grammar, spelling, punctuation), organisation (coherence, sequencing, paragraphing, cohesive devices such as linking words, relative clauses and referencing).\n"+
"7-9: Uses a wide range of common and less common vocabulary appropriately. Uses a wide range of simple and complex structures. High level of accuracy; occasional errors do not impede communication; errors are restricted to less common vocabulary or more complex structures. Effectively organised and sequenced. Uses a wide range of linking words and other cohesive devices appropriately.\n"+
"4-6: Uses a range of common vocabulary appropriately and attempts some less common vocabulary. Uses a range of simple structures and attempts some complex structures. Generally good accuracy; errors do not generally impede communication; errors generally relate to less common vocabulary or complex structures. Generally well organised and sequenced. Uses a range of linking words and cohesive devices generally appropriately.\n"+
"1-3: Uses a limited range of vocabulary. Uses a limited range of structures. Lack of control of language; errors impede communication; errors occur with common vocabulary and simple structures. Limited attempt at organisation and sequencing. Limited attempt to use linking words and cohesive devices.\n"+
"0: No creditable content.\n\n"+
"RULES: Decide content and language separately. If the task is generally fulfilled, award at least 3-4 for content. Within a content band use the lower mark if only some requirements are met and the higher if all or most are. Within a language band use the lowest mark if only a few requirements are met, the middle if some, the highest if all or most. If all requirements of a band are met, consider the band above. If the writing is considerably shorter than 120 words, give 1-2 or less for content. If considerably longer than 160 words, check whether the extra length makes content irrelevant or repetitive or harms accuracy. If the writing is only partly relevant (content 1-2), the full range of language marks is still available. If it is totally irrelevant, give 0 for both. Writing does not need to be imaginative or enjoyable to get top marks. Interpret all descriptors at CEFR B2 level.";

function renderTutor(streaming){
  var box=$("#tmsgs");
  if(!tTurns.length&&!streaming){box.innerHTML='<div class="msg bot"><p>नमस्ते! I can explain grammar, check your sentences, help you plan an answer or quiz you. What would you like to work on?</p></div>'}
  else box.innerHTML=tTurns.map(function(t){return '<div class="msg '+(t.role==="user"?"user":"bot")+'">'+(t.role==="user"?"<p>"+esc(t.content).replace(/\n/g,"<br>")+"</p>":mdLite(t.content))+'</div>'}).join("")+(streaming?'<div class="msg bot" id="tlive">'+spin("Thinking...")+'</div>':'');
  box.scrollTop=box.scrollHeight;
  $("#tsugg").innerHTML=streaming?"":suggestions().map(function(s){return '<button type="button" class="chip">'+esc(s)+'</button>'}).join("");
  $("#tctx").textContent=tutorContext().label;
}
function openTutor(prefill){
  var p=$("#tutor");p.hidden=false;$("#fab").setAttribute("aria-expanded","true");$("#fab").hidden=true;renderTutor(false);
  if(prefill){sendTutor(prefill)}else $("#tin").focus();
}
function closeTutor(){$("#tutor").hidden=true;$("#fab").setAttribute("aria-expanded","false");$("#fab").hidden=AI.ready&&!AI.sample;$("#fab").focus()}
function sendTutor(text){
  text=String(text||"").trim();if(!text||tCtl)return;
  if(!AI.sample){tTurns.push({role:"user",content:text},{role:"assistant",content:"The tutor needs this page to be opened inside Claude."});renderTutor(false);return}
  tTurns.push({role:"user",content:text});tTurns=tTurns.slice(-16);while(tTurns.length&&tTurns[0].role!=="user")tTurns.shift();
  store.setJ("tutor",tTurns);renderTutor(true);$("#tin").value="";$("#tsend").textContent="Stop";
  var ctx=tutorContext(), input=[{role:"user",content:TUTOR_RULES+(ctx.text?"\n\nWhat the student has on screen now:\n"+ctx.text:"")+"\n\n(Conversation follows.)"}].concat(tTurns);
  tCtl=new AbortController();
  AI.sample(input,{signal:tCtl.signal,cache:false,onText:function(u){var l=$("#tlive");if(l)l.innerHTML=mdLite(u.text);$("#tmsgs").scrollTop=$("#tmsgs").scrollHeight}})
  .then(function(r){tTurns.push({role:"assistant",content:r.text})})
  .catch(function(e){if(e&&e.text)tTurns.push({role:"assistant",content:e.text+"\n\n(stopped)"});else if(!(e&&e.code==="cancelled"))tTurns.push({role:"assistant",content:aiErr(e&&e.code)})})
  .then(function(){tCtl=null;store.setJ("tutor",tTurns);$("#tsend").textContent="Send";renderTutor(false)});
}
$("#fab").addEventListener("click",function(){openTutor()});
$("#tclose").addEventListener("click",closeTutor);
$("#tclear").addEventListener("click",function(){if(tCtl)tCtl.abort();tTurns=[];store.setJ("tutor",[]);renderTutor(false)});
$("#tform").addEventListener("submit",function(e){e.preventDefault();if(tCtl){tCtl.abort();return}sendTutor($("#tin").value)});
$("#tin").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!tCtl)sendTutor(this.value)}});
$("#tin").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(140,this.scrollHeight)+"px"});
$("#tsugg").addEventListener("click",function(e){var b=e.target.closest("button");if(b)sendTutor(b.textContent)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#tutor").hidden&&!(AI.tts&&ttsState!=="idle")){e.preventDefault();closeTutor()}});

/* ================= ROUTER ================= */
var VIEWS=["home","read","write","words","papers"], RENDER={home:renderHome,read:renderRead,write:renderWrite,words:renderWords,papers:renderPapers};
function route(){
  var v=(location.hash||"").replace("#","");if(VIEWS.indexOf(v)<0)v="home";
  hideTip();if(AI.tts&&ttsState!=="idle")AI.tts.stop().catch(function(){});
  VIEWS.forEach(function(n){$("#v-"+n).hidden=n!==v});
  RENDER[v]();refreshAI();
  $$(".nav a").forEach(function(a){if(a.getAttribute("href")==="#"+v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(!$("#tutor").hidden)$("#tctx").textContent=tutorContext().label;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();

})();
</script>
